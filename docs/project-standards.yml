exceptions:
  - id: CI-004
    rationale: The repository owner may explicitly direct an administrative push to main. Such a push can bypass branch protection and does not imply that skipped reviews or failing checks passed. Contributor PRs remain governed by the configured requirements.
    scope: Explicitly owner-directed maintainer commits only.
  - id: TS-008
    rationale: The backend keeps ESLint with Prettier because it is the NestJS default, comes pre-configured with the framework tooling, and supports type-aware rules. The frontend uses Biome. Migrating the backend would add churn without user value.
    scope: backend/ only; new packages default to Biome.

