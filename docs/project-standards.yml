contract_version: 0.2.0
standards_version: 0.4.0

standards_source:
  repository: https://github.com/kois-studio/engineering-standards
  revision: f86132fea80126008895b65f76342aaa095e98be

project:
  name: Board Vault
  lifecycle: existing
  maturity: public-beta

standards:
  - documentation
  - testing
  - typescript
  - security
  - dependencies
  - ci-cd
  - operations
  - api
  - data
  - web
  - identity

profiles:
  - angular-application
  - nestjs-backend
  - clerk-identity

assessment_scope: >-
  Initial AI-readiness assessment focused on documentation, safe parallel work,
  CI, local data isolation, and known security/dependency risks. Rules not listed
  below have not been assessed and must not be treated as compliant. The
  rule-by-rule assessment continues in a GitHub issue.

compliance:
  rules:
    - id: DOC-001
      status: compliant
      evidence: docs/AGENTS.md; AGENTS.md
      priority: high
      next_action: Keep the canonical agent instructions current.
    - id: DOC-002
      status: compliant
      evidence: docs/README.md
      priority: high
      next_action: Add new maintained documentation to the index.
    - id: DOC-011
      status: compliant
      evidence: GitHub Issues is the equivalent tracked queue (issue templates in .github/ISSUE_TEMPLATE mirror the work-item fields); docs/work/TODO.md points to it; docs/AGENTS.md routes work there.
      priority: high
      next_action: Keep unfinished work in GitHub Issues.
    - id: TEST-006
      status: compliant
      evidence: package.json; .github/workflows/ci.yml
      priority: high
      next_action: Keep documented test commands aligned with CI.
    - id: SEC-002
      status: compliant
      evidence: .gitignore; backend/.env.example; scripts/check-public-tree.mjs; docs/environments.md
      priority: high
      next_action: Preserve secret and local-data exclusions.
    - id: DEP-006
      status: compliant
      evidence: Backend and frontend `npm audit --audit-level=low` report zero vulnerabilities (CI audits both on every run). Dependabot runs monthly with at most three open PRs per ecosystem; the 2026-09-30 backlog was applied in one tested batch.
      priority: high
      next_action: Review the monthly Dependabot PRs; security updates arrive outside the schedule.
    - id: CI-002
      status: compliant
      evidence: All four required jobs pass on main (run https://github.com/kois-studio/board-vault/actions/runs/36773436842, commit 8dce8a330). CI can also be run manually on a branch before main moves.
      priority: high
      next_action: Keep main green; validate large owner batches on a branch first.
    - id: CI-004
      status: exception
      evidence: GitHub main protection requires review and four checks for PR merges. Owner-authorized direct pushes bypassed the required review on 2026-09-28, 2026-09-29, and 2026-09-30; the 2026-09-30 P2 batch passed all four checks on a branch before main was fast-forwarded.
      priority: high
      next_action: Keep the exception limited to explicitly owner-directed work and report every bypass; contributor PRs remain subject to required review and checks.
    - id: DATA-002
      status: compliant
      evidence: database/migrations; database/scripts/verify-empty-state.mjs; docs/how-to/add-migration.md
      priority: high
      next_action: Add future schema changes as ordered migrations and retain disposable verification.

exceptions:
  - id: CI-004
    rationale: The repository owner may explicitly direct an administrative push to main. Such a push can bypass branch protection and does not imply that skipped reviews or failing checks passed. Contributor PRs remain governed by the configured requirements.
    scope: Explicitly owner-directed maintainer commits only.

deferred_work:
  # Tracked as GitHub Issues since 2026-09-30.
  - id: BOARD-001
    title: Complete the rule-by-rule standards assessment
    priority: medium
    next_action: https://github.com/kois-studio/board-vault/issues/22
