contract_version: 0.2.0
standards_version: 0.4.0

standards_source:
  repository: https://github.com/kois-studio/engineering-standards
  revision: f86132fea80126008895b65f76342aaa095e98be

project:
  name: Board Vault
  lifecycle: existing
  maturity: public-beta

standards:
  - documentation
  - testing
  - typescript
  - security
  - dependencies
  - ci-cd
  - operations
  - api
  - data
  - web
  - identity

profiles:
  - angular-application
  - nestjs-backend
  - clerk-identity

assessment_scope: >-
  Rule-by-rule assessment of every rule in the selected standards and profiles
  at the pinned revision, against the source tree on 2026-10-01. Deferred rules
  link to the GitHub issue that closes them; partial rules name their next
  step. Priority follows rule strength (Required high, Recommended medium,
  Optional low).

