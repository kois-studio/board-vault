<!doctype html>
<html lang="en">
    <head>
        <!-- Global Metadata -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#F3EDF9" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#201C20" media="(prefers-color-scheme: dark)" />
        <base href="/" />
        <script src="/runtime-config.js"></script>

        <!-- Primary Meta Tags -->
        <title>Board Vault</title>
        <meta name="title" content="Board Vault" />
        <meta name="description" content="A private workspace for recurring board-game groups to decide, play, and remember together." />
        <meta name="robots" content="noindex, nofollow, noarchive" />
        <meta property="og:title" content="Board Vault — Game night, remembered" />
        <meta property="og:description" content="A private workspace for recurring board-game groups to decide, play, and remember together." />
        <meta property="og:type" content="website" />
        <meta property="og:image" content="https://board-vault.com/icons/icon-512.png" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Board Vault — Game night, remembered" />
        <meta name="twitter:description" content="A private workspace for recurring board-game groups to decide, play, and remember together." />

        <!-- Applies the appearance before the first paint; ThemeService (core/services/theme.service.ts) takes over after. -->
        <script>
            ;(() => {
                // Each theme's --bv-bg, a copy of THEME_COLORS in theme.service.ts.
                const colors = {
                    ciruela: { light: '#F3EDF9', dark: '#201C20' },
                    felt: { light: '#E8F1ED', dark: '#161F1C' },
                    harbor: { light: '#EAF0F7', dark: '#171C23' },
                    graphite: { light: '#EEEFF1', dark: '#1A1B1E' },
                }
                const saved = {}
                try {
                    for (const key of ['theme', 'palette', 'text-size']) saved[key] = localStorage.getItem(key)
                } catch {}
                const root = document.documentElement
                const dark = saved.theme === 'dark' || (saved.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
                const palette = Object.hasOwn(colors, saved.palette) ? saved.palette : 'ciruela'
                root.classList.toggle('dark', dark)
                root.dataset.theme = palette
                if (saved['text-size'] === 'large' || saved['text-size'] === 'larger') root.dataset.textSize = saved['text-size']
                for (const meta of document.querySelectorAll('meta[name="theme-color"]')) meta.content = colors[palette][dark ? 'dark' : 'light']
            })()
        </script>
    </head>
    <body class="app-bg-primary">
        <app-root></app-root>
    </body>
</html>
