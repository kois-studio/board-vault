<!doctype html>
<html lang="en">
    <head>
        <!-- Global Metadata -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
        <base href="/" />
        <script src="/runtime-config.js"></script>

        <!-- Primary Meta Tags -->
        <title>Board Vault</title>
        <meta name="title" content="Board Vault" />
        <meta name="description" content="Store and organize your tabletop games" />

        <script>
            const savedTheme = localStorage.getItem('theme')
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) document.documentElement.classList.add('dark')
        </script>
    </head>
    <body class="app-bg-primary dark:text-white">
        <app-root></app-root>
    </body>
</html>
