<!--
  The sidebar overlays the page on small screens and participates in the desktop flex layout from the md breakpoint onward.
  - Collapsed state hides the sidebar on mobile and keeps a compact desktop rail.
  - Expanded state overlays on mobile and uses the full desktop navigation width.
-->
<aside
    id="admin-navigation"
    class="bg-zinc-100 dark:bg-zinc-800 h-full shadow-md flex flex-col transition-[width,padding] duration-300 ease-in-out motion-reduce:transition-none p-4"
    [ngClass]="{
        'absolute inset-y-0 left-0 z-30 w-0 overflow-hidden p-0 md:relative md:w-16 md:p-4': collapsed,
        'absolute inset-y-0 left-0 z-30 w-64 md:relative md:w-64': !collapsed
    }"
>
    <!-- Admin Title / Icon -->
    <div
        class="h-[40px] mb-6 flex items-center"
        [ngClass]="{
            'justify-center': collapsed,
            'justify-start': !collapsed
        }"
    >
        <app-icon name="shield-lock" [size]="28" />
        @if (!collapsed) {
        <h2 class="text-xl font-semibold text-zinc-800 dark:text-zinc-100 truncate ml-2">Admin</h2>
        }
    </div>

    <!-- Menu Items -->
    <nav class="flex-grow">
        <ul>
            @for (item of menuItems; track item.routerLink) {
            <li
                [ngClass]="{
                    'flex': collapsed,
                    'block': !collapsed,
                }"
            >
                <a
                    [routerLink]="item.routerLink"
                    routerLinkActive="bg-indigo-600 text-white dark:bg-indigo-500"
                    [routerLinkActiveOptions]="{ exact: item.exactMatch }"
                    class="flex min-h-11 items-center rounded-md p-2 my-1 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition-colors duration-150 ease-in-out text-zinc-700 dark:text-zinc-300 group mx-auto"
                    [title]="item.label"
                    [attr.aria-label]="item.label"
                >
                    <span class="block text-nowrap overflow-hidden">
                        <app-icon [name]="item.icon" [size]="20" />
                        @if (!collapsed) {
                        <span class="transition-opacity duration-300 ease-in-out ml-2">{{ item.label }}</span>
                        }
                    </span>
                </a>
            </li>
            }
        </ul>
    </nav>

    <!-- Exit Button - go back to app -->
    @if (!collapsed) {
    <div class="mt-auto p-2 border-t border-zinc-200 dark:border-zinc-700 text-lg">
        <!-- Dark Mode Toggle -->
        <div class="flex items-center justify-center mb-3">
            <app-dark-mode-toggle />
        </div>
        
        <button
            type="button"
            routerLink="/"
            aria-label="Exit admin panel"
            class="w-full flex items-center justify-center p-2 rounded-md hover:bg-zinc-200 dark:hover:bg-zinc-700 cursor-pointer"
        >
            <app-icon name="logout" [size]="18" />
            <span class="ml-4">Exit</span>
        </button>
    </div>
    }
</aside>
