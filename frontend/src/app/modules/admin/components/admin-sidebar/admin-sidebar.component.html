<!--
  The sidebar overlays the page on small screens and participates in the desktop flex layout from the md breakpoint onward.
  - Collapsed state hides the sidebar on mobile and keeps a compact desktop rail.
  - Expanded state overlays on mobile and uses the full desktop navigation width.
-->
<aside
    id="admin-navigation"
    class="bg-bv-surface-2 h-full shadow-md flex flex-col transition-[width,padding] duration-300 ease-in-out motion-reduce:transition-none p-4"
    [ngClass]="{
        'absolute inset-y-0 left-0 z-30 w-0 overflow-hidden p-0 md:relative md:w-16 md:p-4': collapsed(),
        'absolute inset-y-0 left-0 z-30 w-64 md:relative md:w-64': !collapsed()
    }"
>
    <!-- Admin Title / Icon -->
    <div
        class="h-[40px] mb-6 flex items-center"
        [ngClass]="{
            'justify-center': collapsed(),
            'justify-start': !collapsed()
        }"
    >
        <app-icon name="shield-lock" [size]="28" />
        @if (!collapsed()) {
        <h2 class="text-xl font-semibold text-bv-text truncate ml-2">Admin</h2>
        }
    </div>

    <!-- Menu Items -->
    <nav class="flex-grow">
        <ul>
            @for (item of menuItems; track item.routerLink) {
            <li
                [ngClass]="{
                    'flex': collapsed(),
                    'block': !collapsed(),
                }"
            >
                <a
                    [routerLink]="item.routerLink"
                    routerLinkActive="bg-bv-primary text-bv-on-primary"
                    [routerLinkActiveOptions]="{ exact: item.exactMatch }"
                    class="flex min-h-11 items-center rounded-md p-2 my-1 hover:bg-bv-surface-2 transition-colors duration-150 ease-in-out text-bv-text-muted group mx-auto"
                    [title]="item.label"
                    [attr.aria-label]="item.label"
                >
                    <span class="block text-nowrap overflow-hidden">
                        <app-icon [name]="item.icon" [size]="20" />
                        @if (!collapsed()) {
                        <span class="transition-opacity duration-300 ease-in-out ml-2">{{ item.label }}</span>
                        }
                        @if (item.routerLink === 'proposals' && pendingCount()) {
                        <span class="ml-2 rounded-full bg-bv-danger px-2 py-0.5 text-xs font-semibold text-white" [attr.aria-label]="pendingCount() + ' pending'">{{ pendingCount() }}</span>
                        }
                    </span>
                </a>
            </li>
            }
        </ul>
    </nav>

    <!-- Exit Button - go back to app -->
    @if (!collapsed()) {
    <div class="mt-auto p-2 border-t border-bv-border text-lg">
        <!-- Dark Mode Toggle -->
        <div class="flex items-center justify-center mb-3">
            <app-theme-switch />
        </div>
        
        <button
            type="button"
            routerLink="/"
            aria-label="Exit admin panel"
            class="w-full flex items-center justify-center p-2 rounded-md hover:bg-bv-surface-2 cursor-pointer"
        >
            <app-icon name="logout" [size]="18" />
            <span class="ml-4">Exit</span>
        </button>
    </div>
    }
</aside>
