<div class="relative flex h-screen bg-bv-bg">
    <!-- Sidebar: Pass the collapsed state -->
    <app-admin-sidebar [collapsed]="isSidebarCollapsed()"></app-admin-sidebar>

    @if (!isSidebarCollapsed()) {
        <button
            type="button"
            aria-label="Close admin navigation"
            class="fixed inset-0 z-20 bg-black/40 md:hidden"
            (click)="toggleSidebar()"
        ></button>
    }

    <!-- Main Content Area -->
    <div class="flex flex-col flex-1 overflow-hidden">
        <header class="p-2 bg-bv-surface border-b dark:border-bv-border shadow-sm">
            <button
                type="button"
                (click)="toggleSidebar()"
                [attr.aria-expanded]="!isSidebarCollapsed()"
                aria-controls="admin-navigation"
                title="Toggle Sidebar"
                class="min-h-11 min-w-11 rounded-md px-2 py-1 text-bv-text-muted hover:bg-bv-surface-2 focus:outline-none focus:ring-2 focus:ring-bv-primary"
            >
                <app-icon name="panel-left" [size]="24" aria-hidden="true" />
            </button>
        </header>

        <main id="main-content" tabindex="-1" class="flex-1 overflow-y-auto p-6 outline-none">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
