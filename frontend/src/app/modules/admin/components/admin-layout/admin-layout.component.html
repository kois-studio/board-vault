<div class="flex h-screen bg-zinc-50 dark:bg-zinc-900">
    <!-- Sidebar: Pass the collapsed state -->
    <app-admin-sidebar [collapsed]="isSidebarCollapsed()"></app-admin-sidebar>

    <!-- Main Content Area -->
    <div class="flex flex-col flex-1 overflow-hidden">
        <header class="p-2 bg-white dark:bg-zinc-800 border-b dark:border-zinc-700 shadow-sm">
            <button
                (click)="toggleSidebar()"
                title="Toggle Sidebar"
                class="px-2 py-1 rounded-md hover:bg-zinc-100 dark:hover:bg-zinc-700 text-zinc-600 dark:text-zinc-300 cursor-pointer"
            >
                <i class="bi bi-layout-sidebar text-2xl"></i>
            </button>
        </header>

        <main class="flex-1 p-6 overflow-y-auto transition-all duration-300 ease-in-out">
            <!-- 
                TODO: sidebar overlay in mobile?
                <main [ngClass]="{
                    'md:ml-64': !isSidebarCollapsed(),
                    'md:ml-20': isSidebarCollapsed()
                }">

                On small screens (mobile), the sidebar might overlay or push content.
                The ml-20/ml-64 classes are for medium screens and up (md:).
                For mobile, you might want the sidebar to be an overlay triggered by a hamburger,
                or for the main content to always have ml-0 and the sidebar pushes it.
                This example assumes the sidebar reduces width and main content adjusts on md+.
                On smaller screens, the sidebar might be hidden or overlay.
                Let's simplify for now: the sidebar width changes, and main content margin adjusts on md+.
            -->
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
