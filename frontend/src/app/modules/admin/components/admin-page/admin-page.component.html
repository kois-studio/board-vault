<section>
    <app-admin-page-header title="Overview" description="Look after the shared game catalogue: review what people propose, and keep games and tags tidy." />

    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
        @for (area of adminAreas; track area.route) {
            <a
                [routerLink]="area.route"
                class="group rounded-xl border border-bv-border bg-bv-surface p-6 shadow-sm transition hover:-translate-y-0.5 hover:border-bv-primary hover:shadow-md focus:outline-none focus:ring-2 focus:ring-bv-primary focus:ring-offset-2 dark:focus:ring-offset-bv-surface"
            >
                <span class="mb-5 flex h-12 w-12 items-center justify-center rounded-lg bg-bv-primary-soft text-bv-on-primary-soft" aria-hidden="true">
                    <app-icon [name]="area.icon" [size]="28" />
                </span>
                <h3 class="text-xl font-semibold text-bv-text group-hover:text-bv-primary">{{ area.title }}</h3>
                <p class="mt-2 text-sm leading-6 text-bv-text-muted">{{ area.description }}</p>
                <span class="mt-5 inline-flex items-center gap-2 text-sm font-semibold text-bv-primary">
                    Open area <app-icon name="arrow-right" [size]="16" aria-hidden="true" />
                </span>
            </a>
        }
    </div>
</section>
