<!-- Profile Picture and Dropdown Trigger -->
<div class="relative">
    <button
        #profileTrigger
        type="button"
        (click)="toggleDropdown()"
        class="relative cursor-pointer rounded-full focus-visible:outline-none"
        aria-label="Open profile menu"
        aria-haspopup="menu"
        aria-controls="profile-menu"
        [attr.aria-expanded]="isDropdownVisible"
    >
        @if (currentUser$()) {
            <app-image-profile [avatar]="currentUser$()!.avatar" />
        }
        @if (userInvitations$().length + userUnreadNotificationsComputed().length) {
            <div
                class="absolute -bottom-1 -right-1 flex h-5 w-5 items-center justify-center rounded-full bg-bv-primary text-bv-on-primary"
                [attr.aria-label]="userInvitations$().length + userUnreadNotificationsComputed().length + ' unread profile items'"
            >
                <span class="text-sm" aria-hidden="true">{{ userInvitations$().length + userUnreadNotificationsComputed().length }}</span>
            </div>
        }
    </button>

    <!-- Dropdown Menu -->
    @if (isDropdownVisible) {
    <div id="profile-menu" role="menu" class="absolute right-0 z-50 mt-2 w-64 rounded-lg border border-bv-border bg-bv-surface shadow-xl">
        @if (currentUser$()) {
            <div class="flex items-center p-4">
                <app-image-profile [avatar]="currentUser$()!.avatar" />
                <div class="ml-3">
                    <p class="font-semibold text-bv-text">{{ currentUser$()!.displayName }}</p>
                    <p class="text-sm text-bv-text-muted">{{ currentUser$()!.username }}</p>
                </div>
            </div>
        }
        <div class="border-t border-bv-text-muted">
            <a routerLink="/settings" role="menuitem" (click)="onClickProfileSettings()" class="flex w-full items-center gap-2 border-b border-bv-border px-4 py-3 text-left text-bv-text-muted hover:bg-bv-bg">
                <app-icon name="settings" [size]="17" /> Manage account
            </a>
            <button type="button" role="menuitem" (click)="onClickInvitations()" class="flex w-full items-center gap-2 border-b border-bv-border px-4 py-3 text-left text-bv-text-muted hover:bg-bv-bg">
                <app-icon name="mail" [size]="17" /> Group Invitations
                @if (userInvitations$().length) {
                    <div class="ml-auto flex h-5 w-5 items-center justify-center rounded-full bg-bv-primary text-bv-on-primary">
                        <span class="text-sm" aria-hidden="true">{{ userInvitations$().length }}</span>
                    </div>
                }
            </button>
            <button type="button" role="menuitem" (click)="onClickNotifications()" class="flex w-full items-center gap-2 border-b border-bv-border px-4 py-3 text-left text-bv-text-muted hover:bg-bv-bg">
                <app-icon name="bell" [size]="17" /> Notifications
                @if (userUnreadNotificationsComputed().length > 0) {
                    <div class="ml-auto flex h-5 w-5 items-center justify-center rounded-full bg-bv-primary text-bv-on-primary">
                        <span class="text-sm" aria-hidden="true">{{ userUnreadNotificationsComputed().length }}</span>
                    </div>
                }
            </button>
            <a routerLink="/submissions" role="menuitem" (click)="onClickSubmissions()" class="flex w-full items-center gap-2 border-b border-bv-border px-4 py-3 text-left text-bv-text-muted hover:bg-bv-bg">
                <app-icon name="file-text" [size]="17" /> My Submissions
                @if (userProposalStats$().totalProposals > 0) {
                    <div class="ml-auto flex h-5 w-5 items-center justify-center rounded-full bg-bv-primary text-bv-on-primary">
                        <span class="text-sm" aria-hidden="true">{{ userProposalStats$().totalProposals }}</span>
                    </div>
                }
            </a>
            <button type="button" role="menuitem" (click)="onClickSignOut()" class="flex w-full items-center gap-2 px-4 py-3 text-left text-bv-text-muted hover:bg-bv-bg">
                <app-icon name="arrow-right" [size]="17" /> Sign out
            </button>
        </div>
    </div>
    }
</div>

<!-- Modal: Invitations -->
<app-modal-profile-invitations />

<!-- Modal: Notifications -->
<app-modal-profile-notifications />
