<header class="p-2 border-b border-zinc-500">
    <nav class="animate__animated animate__fadeIn relative flex items-center justify-between px-4">
        <a routerLink="/" aria-label="Home">
            <span class="hidden">Home</span>
            <img src="/images/logo.webp" alt="logo" class="w-16" />
        </a>

        <!-- DESKTOP MENU -->
        <div>
            <div class="flex items-center justify-between gap-6">
                @if (!getIsLogged) {
                <a routerLink="/login" class="app-btn-secondary mr-4">Log In</a>
                <a routerLink="/register" class="app-btn-primary mr-4">Get it free</a>
                } @if (getIsLogged) {
                <app-profile-menu />
                }
            </div>
        </div>

        <!-- <div class="absolute left-0 top-20 lg:relative lg:top-0">
             <language-selector />
        </div> -->
    </nav>
</header>
