<header class="p-2 border-b border-zinc-500 bg-white dark:bg-zinc-800">
    <nav class="animate__animated animate__fadeIn relative flex items-center justify-between px-4 z-40">
        <a routerLink="/" aria-label="Home">
            <span class="hidden">Home</span>
            <img src="/images/logo.webp" alt="logo" class="w-16" />
        </a>

        <app-dark-mode-toggle />
        <!-- DESKTOP MENU -->
        <div>
            <div class="flex items-center justify-between gap-6">
                @if (!isAuthenticated()) {
                    <a class="hidden lg:block" routerLink="/" fragment="features">Features</a>
                    <a class="hidden lg:block" routerLink="/" fragment="how-it-works">How it works</a>
                    @if (clerkIsAvailable()) {
                        @if (!clerkIsSignedIn()) {
                            <button type="button" class="cursor-pointer" (click)="openClerkSignIn()">Log In</button>
                            <app-button type="button" (click)="openClerkSignUp()">Sign Up</app-button>
                        } @else {
                            <button type="button" class="cursor-pointer" (click)="verifyClerkLink()" [disabled]="clerkLinkInProgress()">
                                {{ clerkLinkInProgress() ? 'Checking…' : 'Verify Clerk link' }}
                            </button>
                            <button type="button" class="cursor-pointer" (click)="signOutClerk()">Sign Out</button>
                        }
                        @if (clerkLinkStatus()) {
                            <span class="max-w-64 text-xs text-right" role="status">{{ clerkLinkStatus() }}</span>
                        }
                    } @else {
                        <a routerLink="/login">Log In</a>
                        <app-button routerLink="/register">Sign Up</app-button>
                    }
                } @else {
                    @if (isCurrentUserAdmin()) {
                        <a routerLink="/admin" class="text-sm font-medium hover:underline text-red-600 dark:text-red-400" aria-label="Admin Panel">
                            Admin Panel
                        </a>
                    }
                    <app-profile-menu />
                }
            </div>
        </div>

        <!-- <div class="absolute left-0 top-20 lg:relative lg:top-0">
             <language-selector />
        </div> -->
    </nav>
</header>
