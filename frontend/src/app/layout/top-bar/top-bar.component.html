<container-wrapper>
    <nav class="flex items-center justify-start gap-2 overflow-x-auto border-b border-zinc-200 dark:border-zinc-700 md:justify-center md:gap-4" aria-label="Section navigation">
        @for (section of sections; track section.path) {
            <a
                [routerLink]="section.path"
                [attr.aria-current]="activeSection() === section ? 'page' : null"
                class="block min-h-11 whitespace-nowrap px-4 py-3 text-sm font-medium {{ activeSection() === section ? 'border-b-2 border-black dark:border-white' : '' }}"
            >{{ section.name }}</a>
        }
    </nav>
</container-wrapper>

@if (activeSection()?.subsections; as subsections) {
    <div class="container mx-auto max-w-6xl px-4">
        <nav class="flex items-center justify-start gap-2 overflow-x-auto md:justify-center md:gap-4" aria-label="Subsection navigation">
            @for (subsection of subsections; track subsection.path) {
                <a
                    [routerLink]="subsection.path"
                    [attr.aria-current]="isSubsectionActive(subsection.path) ? 'page' : null"
                    class="flex min-h-11 items-center gap-2 whitespace-nowrap px-3 py-3 text-sm font-medium md:px-5 {{ isSubsectionActive(subsection.path) ? 'border-b-2 border-black dark:border-white' : '' }}"
                >
                    <app-icon [name]="subsection.icon" [size]="16" />
                    {{ subsection.name }}
                </a>
            }
        </nav>
    </div>
}
