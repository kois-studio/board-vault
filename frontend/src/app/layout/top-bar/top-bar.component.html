<container-wrapper>
    <div class="border-b border-zinc-200 dark:border-zinc-700 flex items-center justify-center gap-4">
        @for (section of sections; track $index) {
            <a
                [routerLink]="section.id"
                routerLinkActive="border-b-2 border-black dark:border-white"
                class="block px-5 py-3 text-sm font-medium whitespace-nowrap"
            >{{ section.name }}</a>
        }
    </div>
</container-wrapper>
