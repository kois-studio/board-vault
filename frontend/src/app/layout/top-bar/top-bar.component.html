<container-wrapper>
    <nav class="flex items-center justify-start gap-2 overflow-x-auto border-b border-bv-border md:justify-center md:gap-4" aria-label="Section navigation">
        @for (section of sections; track section.path) {
            <a
                [routerLink]="section.path"
                [attr.aria-current]="activeSection() === section ? 'page' : null"
                class="block min-h-11 whitespace-nowrap px-4 py-3 border-b-2 text-sm font-medium transition {{ activeSection() === section ? 'border-bv-primary text-bv-primary' : 'border-transparent text-bv-text-muted hover:text-bv-text' }}"
            >{{ section.name }}</a>
        }
    </nav>
</container-wrapper>

@if (activeSection()?.subsections; as subsections) {
    <div class="container mx-auto max-w-6xl px-4">
        <nav class="flex items-center justify-start gap-2 overflow-x-auto md:justify-center md:gap-4" aria-label="Subsection navigation">
            @for (subsection of subsections; track subsection.path) {
                <a
                    [routerLink]="subsection.path"
                    [attr.aria-current]="isSubsectionActive(subsection.path) ? 'page' : null"
                    class="flex min-h-11 items-center gap-2 whitespace-nowrap px-2.5 py-3 sm:px-3 text-sm font-medium border-b-2 md:px-5 transition {{ isSubsectionActive(subsection.path) ? 'border-bv-primary text-bv-primary' : 'border-transparent text-bv-text-muted hover:text-bv-text' }}"
                >
                    <app-icon class="hidden sm:inline-flex" [name]="subsection.icon" [size]="16" aria-hidden="true" />
                    {{ subsection.name }}
                </a>
            }
        </nav>
    </div>
}
