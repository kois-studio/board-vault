<app-layout-header />

@if (showsAppFrame()) {
<app-layout-section-tabs />
}

<app-connectivity-banner />

@if (isClerkAuthHandoffActive()) {
<app-account-pending />
} @else {
<main id="main-content" tabindex="-1" class="outline-none">
    @if (isAuthenticated()) {
    <app-usage-notice />
    }
    <router-outlet />
</main>
}

<app-layout-footer />

@if (showsAppFrame()) {
<app-layout-bottom-tabs />
}
