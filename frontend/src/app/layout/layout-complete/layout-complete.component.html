<app-layout-header />

@if (showsAppFrame()) {
<app-layout-section-tabs />
}

<app-connectivity-banner />

@if (isClerkAuthHandoffActive()) {
<app-account-pending />
} @else {
<!-- While the usage notice floats at the bottom, room under the page so it can scroll clear of it. -->
<main id="main-content" tabindex="-1" class="outline-none has-[[data-usage-notice]]:pb-96 lg:has-[[data-usage-notice]]:pb-80">
    @if (isAuthenticated()) {
    <app-usage-notice />
    }
    <router-outlet />
</main>
}

<app-layout-footer />

@if (showsAppFrame()) {
<app-layout-bottom-tabs />
}
