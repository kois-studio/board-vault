<container-wrapper>
    <div class="flex flex-col md:flex-row">
        <!-- Left sidebar -->
        <div class="md:w-1/4 border-r-4 border-zinc-700 p-4 rounded-l md:min-h-[30rem]">
            <app-card-account [member]="currentUser$()" />

            <div class="pt-4 grid gap-2">
                <button
                    routerLink="/settings/account"
                    [routerLinkActive]="['bg-zinc-800']"
                    class="flex gap-2 py-2 px-4 rounded-lg hover:bg-zinc-800 w-full"
                >
                    <i class="bi bi-person-circle"></i>
                    <span>Profile</span>
                </button>
                <button
                    routerLink="/settings/security"
                    [routerLinkActive]="['bg-zinc-800']"
                    class="flex gap-2 py-2 px-4 rounded-lg hover:bg-zinc-800 w-full"
                >
                    <i class="bi bi-shield-lock-fill"></i>
                    <span>Security</span>
                </button>
                <button
                    routerLink="/settings/contact"
                    [routerLinkActive]="['bg-zinc-800']"
                    class="flex gap-2 py-2 px-4 rounded-lg hover:bg-zinc-800 w-full"
                >
                    <i class="bi bi-envelope-fill"></i>
                    <span>Contact</span>
                </button>
            </div>
        </div>
        <!-- Right content area -->
        <div class="md:w-3/4 p-8">
            <router-outlet />
        </div>
    </div>
</container-wrapper>
