<h2 class="text-2xl font-bold tracking-wide pb-2">Profile</h2>
<p class="text-secondary pb-8">How you appear to people in your groups.</p>

<section aria-labelledby="avatar-heading" class="py-4">
    <h3 id="avatar-heading" class="text-sm font-semibold text-secondary">Profile avatar</h3>
    <div class="lg:items-center flex justify-start items-center pt-3">
    <div class="relative border-4 border-bv-border rounded-full">
        <!-- Original Image Profile Component -->
        <app-image-profile [avatar]="$safeNavigationMigration(currentUser$()?.avatar)" size="large" />

        <!-- Edit button overlay -->
        <button
            type="button"
            aria-label="Edit profile avatar"
            class="absolute bottom-0 right-0 top-0 bg-black/60 text-white font-bold tracking-wider rounded-full h-full w-full flex items-center justify-center opacity-90 focus-visible:opacity-100 motion-safe:transition-opacity duration-200 cursor-pointer"
            (click)="showAvatarEditor()"
        >
            <span class="text-sm">Edit</span>
        </button>
    </div>
    </div>
    <p class="mt-3 text-sm text-secondary">Your avatar and profile details are account information. They are shown to people in groups where you participate.</p>
</section>

<div class="lg:items-center items-start py-4">
    <h3 class="text-bv-text-muted pb-1">Display Name</h3>
    <form-update-display-name />
</div>

<div class="lg:items-center items-start py-4">
    <h3 class="text-bv-text-muted pb-1">Username</h3>
    <form-update-username />
</div>

<!-- Avatar Editor Modal -->
<app-modal-avatar-editor />
