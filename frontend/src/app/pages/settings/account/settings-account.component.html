<h2 class="text-2xl font-bold tracking-wide pb-2">Account</h2>
<p class="text-secondary pb-8">Manage your account profile details.</p>

<div class="lg:items-center flex justify-start items-center py-4">
    <div class="relative border-4 border-white rounded-full">
        <!-- Original Image Profile Component -->
        <app-image-profile [avatar]="currentUser$()?.avatar" size="large" />

        <!-- Edit button overlay -->
        <button
            class="absolute bottom-0 right-0 top-0 bg-zinc-900/70 text-white font-bold tracking-wider rounded-full h-full w-full flex items-center justify-center opacity-0 hover:opacity-100 transition-opacity duration-200 cursor-pointer"
            (click)="showAvatarEditor()"
        >
            <span class="text-sm">EDIT</span>
        </button>
    </div>
</div>

<div class="lg:items-center items-start py-4">
    <h3 class="text-gray-400 pb-1">Display Name</h3>
    <form-update-display-name />
</div>

<div class="lg:items-center items-start py-4">
    <h3 class="text-gray-400 pb-1">Username</h3>
    <form-update-username />
</div>

<!-- Avatar Editor Modal -->
<app-modal-avatar-editor />
