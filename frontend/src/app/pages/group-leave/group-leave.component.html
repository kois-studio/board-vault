@if (groupData) {
<div class="flex items-center justify-center min-h-screen">
    <div class="bg-zinc-800 p-8 rounded-lg shadow-md max-w-md w-full text-center">
        <h1 class="text-2xl font-bold mb-4">Are you sure you want to leave the group?</h1>
        <p class="text-gray-400 mb-6">This action cannot be undone.</p>
        <div class="flex justify-center space-x-4">
            <button (click)="onGoBack()" class="app-btn-primary">Cancel</button>
            <button (click)="onConfirmLeaveGroup()" class="app-btn-error">Leave Group</button>
        </div>
    </div>
</div>
} @else {
<div class="flex items-center justify-center min-h-screen">
    <div class="bg-zinc-800 p-8 rounded-lg shadow-md max-w-md w-full text-center">
        <h1 class="text-2xl font-bold mb-4">Oops. Group Not Found</h1>
        <p class="text-gray-400 mb-6">
            The group you are trying to leave does not exist. <br />Try again later or contact support.
        </p>
        <button (click)="onGoBack()" class="app-btn-primary">Go Back</button>
    </div>
</div>
}
