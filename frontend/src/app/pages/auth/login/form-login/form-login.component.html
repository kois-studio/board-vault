<form
    [formGroup]="loginFormGroup"
    (ngSubmit)="handleLogin()"
    class="flex flex-col gap-4 rounded bg-purple-100 dark:bg-zinc-800 p-8 w-96 mx-auto"
>
    <!-- 1. EMAIL -->
    <div>
        <input
            type="email"
            formControlName="email"
            placeholder="Email ..."
            class="app-input"
            [class]="emailClass"
            autofocus
            required
        />
        <div *ngIf="email?.invalid && (email?.dirty || email?.touched)">
            <div *ngIf="email?.hasError('required')" class="text-sm text-red-500 py-1">
                <i class="bi bi-exclamation-circle-fill"></i> Email is required.
            </div>
            <div *ngIf="email?.hasError('email')" class="text-sm text-red-500 py-1">
                <i class="bi bi-exclamation-circle-fill"></i> Email format is wrong.
            </div>
            <div *ngIf="email?.hasError('maxlength')" class="text-sm text-red-500 py-1">
                <i class="bi bi-exclamation-circle-fill"></i> Email is too long.
            </div>
        </div>
    </div>

    <!-- 2. PASSWORD -->
    <div>
        <input
            type="password"
            formControlName="password"
            placeholder="Password ..."
            class="app-input"
            [class]="passwordClass"
            (keydown.enter)="handleLogin()"
            required
        />
        <div *ngIf="password?.invalid && (password?.dirty || password?.touched)">
            <div *ngIf="password?.hasError('required')" class="text-sm text-red-500 py-1">
                <i class="bi bi-exclamation-circle-fill"></i> Password is required.
            </div>
            <div *ngIf="password?.hasError('minlength')" class="text-sm text-red-500 py-1">
                <i class="bi bi-exclamation-circle-fill"></i> Password is too short.
            </div>
            <div *ngIf="password?.hasError('maxlength')" class="text-sm text-red-500 py-1">
                <i class="bi bi-exclamation-circle-fill"></i> Password is too long.
            </div>
        </div>
    </div>

    <!-- 3. SUBMIT -->
    <app-button
        type="submit"
        [disabled]="disableSubmit"
        [loading]="isLoading"
        size="large"
        required
    >
        Access
    </app-button>
</form>

<!-- 4. RESET PASSWORD LINK -->
<div class="text-center mt-4">
    <a routerLink="/reset-password/request" class="text-blue-500 underline">
        Forgot Password?
    </a>
</div>
