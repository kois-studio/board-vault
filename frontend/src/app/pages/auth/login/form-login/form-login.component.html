<form
    [formGroup]="loginFormGroup"
    (ngSubmit)="handleLogin()"
    class="mx-auto flex w-full max-w-md flex-col gap-4 rounded bg-purple-100 p-6 dark:bg-zinc-800 sm:p-8"
>
    <div>
        <label for="login-email" class="mb-1 block text-sm font-medium text-zinc-800 dark:text-zinc-200">Email</label>
        <input
            id="login-email"
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="you@example.com"
            class="app-input"
            [class]="emailClass"
            autofocus
            required
        />
        <div *ngIf="email?.invalid && (email?.dirty || email?.touched)">
            <div *ngIf="email?.hasError('required')" class="text-sm text-red-500 py-1">
                <app-icon name="circle-alert" [size]="16" /> Email is required.
            </div>
            <div *ngIf="email?.hasError('email')" class="text-sm text-red-500 py-1">
                <app-icon name="circle-alert" [size]="16" /> Email format is wrong.
            </div>
            <div *ngIf="email?.hasError('maxlength')" class="text-sm text-red-500 py-1">
                <app-icon name="circle-alert" [size]="16" /> Email is too long.
            </div>
        </div>
    </div>

    <div>
        <label for="login-password" class="mb-1 block text-sm font-medium text-zinc-800 dark:text-zinc-200">Password</label>
        <input
            id="login-password"
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Your password"
            class="app-input"
            [class]="passwordClass"
            (keydown.enter)="handleLogin()"
            required
        />
        <div *ngIf="password?.invalid && (password?.dirty || password?.touched)">
            <div *ngIf="password?.hasError('required')" class="text-sm text-red-500 py-1">
                <app-icon name="circle-alert" [size]="16" /> Password is required.
            </div>
            <div *ngIf="password?.hasError('minlength')" class="text-sm text-red-500 py-1">
                <app-icon name="circle-alert" [size]="16" /> Password is too short.
            </div>
            <div *ngIf="password?.hasError('maxlength')" class="text-sm text-red-500 py-1">
                <app-icon name="circle-alert" [size]="16" /> Password is too long.
            </div>
        </div>
    </div>

    <app-button
        type="submit"
        [disabled]="disableSubmit"
        [loading]="isLoading"
        size="large"
        [wide]="true"
    >
        Sign in with older account
    </app-button>
</form>

<div class="mt-4 text-center">
    <a routerLink="/reset-password/request" class="text-blue-700 underline dark:text-blue-300">
        Forgot your older-account password?
    </a>
</div>
