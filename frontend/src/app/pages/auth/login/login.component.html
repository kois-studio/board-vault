<main class="min-h-[calc(100vh-8rem)] bg-gradient-to-b from-bv-primary-soft to-bv-surface px-4 py-10 sm:px-6 lg:py-16">
    <section class="mx-auto max-w-md rounded-3xl border border-bv-border bg-bv-surface p-6 shadow-xl sm:p-8">
        <!-- The heading is the largest text from the first paint, so a late outage message never becomes the LCP. -->
        <h1 class="text-center text-4xl font-bold tracking-tight text-bv-text" i18n="Heading of the sign-in page">Sign in to Board Vault</h1>

        @if (clerkIsAvailable() || !clerkIsLoaded()) {
            <!-- Clerk's form, on the page (#324): email, password or a one-time code, Forgot password, and Sign up. -->
            <app-clerk-form class="mt-6 block" kind="sign-in" />
        } @else if (!clerkIsConfigured()) {
            <p class="mt-6 rounded-lg border border-bv-danger/30 bg-bv-danger/10 p-4 text-center text-sm text-bv-danger" role="alert" i18n="Error on the sign-in page, seen only by developers">
                Sign-in is not configured for this environment. Set <code>CLERK_PUBLISHABLE_KEY</code> and restart the app.
            </p>
        } @else {
            <p class="mt-6 rounded-lg border border-bv-warning/30 bg-bv-warning/10 p-4 text-center text-sm text-bv-warning" role="alert" i18n="Error on the sign-in page when the sign-in service does not load">
                The secure sign-in service could not be reached. Refresh this page to try again.
            </p>
        }

    </section>
</main>
