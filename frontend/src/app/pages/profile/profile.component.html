<!-- Button to open the dialog -->
<button (click)="showDialog()">
    <img src="https://via.placeholder.com/50" alt="Profile Picture" class="rounded-full w-8 h-8" />
</button>

<!-- Dialog overlay -->
@if (isVisible) {
<div class="fixed inset-0 bg-zinc-900 bg-opacity-50 flex justify-center items-center">
    <!-- Dialog box -->
    <div class="bg-zinc-900 rounded-2xl border border-zinc-700 w-3/4 max-w-4xl relative">
        <!-- Close button -->
        <button (click)="hideDialog()" class="py-2 px-4 rounded-lg hover:bg-zinc-800 absolute top-2 right-2">
            <i class="bi bi-x-lg"></i>
        </button>
        <!-- Dialog content -->
        <div class="flex">
            <!-- Left sidebar -->
            <div class="w-1/4 border-r border-zinc-700 p-4 bg-zinc-800 rounded-l-2xl min-h-[30rem]">
                <h2 class="text-2xl">Account</h2>
                <h3 class="text-gray-500 text-sm">Manage your account info.</h3>

                <div class="pt-4 grid gap-2">
                    <button class="flex gap-2 py-2 px-4 rounded-lg hover:bg-zinc-900 w-full">
                        <i class="bi bi-person-circle"></i>
                        <span>Profile</span>
                    </button>
                    <button class="flex gap-2 py-2 px-4 rounded-lg hover:bg-zinc-900 w-full">
                        <i class="bi bi-shield-lock-fill"></i>
                        <span>Security</span>
                    </button>
                </div>
            </div>
            <!-- Right content area -->
            <div class="w-3/4 p-8">
                <h3 class="text-lg font-semibold border-b border-zinc-500 pb-4">Profile details</h3>

                <!-- Profile Picture and Name -->
                <div class="flex gap-x-2 items-center mb-6 border-b border-zinc-500 py-4">
                    <h3 class="w-48 text-gray-500">Profile</h3>
                    <div class="w-full flex justify-between items-center">
                        <div class="flex items-center">
                            <img
                                src="https://via.placeholder.com/50"
                                alt="Profile Picture"
                                class="rounded-full w-12 h-12 mr-4"
                            />
                            <p class="text-lg font-semibold">example-user M. example-contributor</p>
                        </div>
                        <button class="py-2 px-4 rounded-lg bg-zinc-700 hover:bg-zinc-800">Update profile</button>
                    </div>
                </div>

                <!-- Email addresses -->
                <div class="flex gap-x-2 items-center mb-6 border-b border-zinc-500 py-4">
                    <h3 class="w-48 text-gray-500">Email address</h3>
                    <div class="w-full flex justify-between items-center">
                        <p class="text-lg mr-4">{{ "example-usermf99@gmail.com" }}</p>
                        <button class="py-2 px-4 rounded-lg bg-zinc-700 hover:bg-zinc-800">Change email</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
}
