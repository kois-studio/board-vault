<app-page-header titleText="Browse Games" [showActionButton]="true">
    Browse games to add to your collection

    <app-button class="action-button" icon="plus-lg" routerLink="/collection/browse/request-new-game">Request New Game</app-button>
</app-page-header>
<container-wrapper>
    <!-- Loading state -->
    @if (isLoadingGames$()) {
        <section class="flex flex-wrap gap-4">
            <app-skeleton-card-game />
            <app-skeleton-card-game />
            <app-skeleton-card-game />
        </section>
    } @else if (gamesNotOwnedByUserComputed().length === 0) {
        <!-- no data -->
        <div class="text-center text-secondary">
            <p>No games in your wishlist yet</p>
        </div>
    } @else {
        <section class="flex flex-wrap gap-4">
            @for (game of gamesNotOwnedByUserComputed(); track $index) {
                <app-card-game
                    [routerLink]="['/games', game.id]"
                    [title]="game.title"
                    [imageUrl]="game.imageUrl"
                    [gameAvgDuration]="game.gameAvgDuration"
                    [minPlayers]="game.minPlayers"
                    [maxPlayers]="game.maxPlayers"
                />
            }
        </section>
    }

    <div class="grid grid-cols-2 w-96 gap-12 mt-24">
        <app-tooltip text="More info here!" position="top">
            <button class="bg-red-500 p-2" icon="plus-lg">Tooltip top</button>
        </app-tooltip>
        
        <app-tooltip text="More info here!" position="bottom">
            <button class="bg-red-500 p-2" icon="plus-lg">Tooltip bottom</button>
        </app-tooltip>
        
        <app-tooltip text="More info here!" position="left">
            <button class="bg-red-500 p-2" icon="plus-lg">Tooltip left</button>
        </app-tooltip>
        
        <app-tooltip text="More info here!" position="right">
            <button class="bg-red-500 p-2" icon="plus-lg">Tooltip right</button>
        </app-tooltip>
    </div>
    
</container-wrapper>
