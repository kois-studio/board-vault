@if (!isSubmitted()) {
    <app-page-header titleText="Propose a Game">
        Submit a game proposal to be added to our collection
    </app-page-header>
    <container-wrapper>
        <form-game-submission 
            [initialTitle]="initialTitle()"
            (proposalSubmitted)="onProposalSubmitted()"
        />
    </container-wrapper>
} @else {
    <container-wrapper>
        <div class="flex flex-col items-center justify-center min-h-[60vh] text-center space-y-6">
            <div class="space-y-4">
                <div class="text-6xl text-bv-success mb-4">
                    <app-icon name="circle-check" [size]="20" />
                </div>
                <h2 class="text-2xl font-bold text-bv-text">Thank You!</h2>
                <p class="text-lg text-bv-text-muted max-w-md">
                    Thanks for your proposal! We will review it as soon as possible and let you know the outcome.
                </p>
            </div>
            <button appButton (click)="navigateBack()">
                Back to Collection
            </button>
        </div>
    </container-wrapper>
}
