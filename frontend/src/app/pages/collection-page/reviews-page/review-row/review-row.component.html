<div class="bg-zinc-200 hover:bg-zinc-300 dark:bg-zinc-800/50 hover:dark:bg-zinc-800/70 rounded-lg p-3 transition-all">
    <!-- Main content wrapper with flex-col on mobile -->
    <div class="flex flex-col sm:flex-row gap-3">
        <!-- First row wrapper -->
        <a routerLink="/games/{{ game.id }}" class="flex items-center gap-3 w-full">
            <!-- Image and game info (unchanged) -->
            <div
                class="h-16 w-16 rounded-lg border border-zinc-700 overflow-hidden bg-cover bg-no-repeat bg-center shrink-0"
                [style]="{ 'background-image': 'url(' + game.imageUrl + ')' }"
            ></div>

            <div class="grow min-w-0">
                <h3 class="text-lg font-semibold mb-1 truncate">{{ game.title }}</h3>
                <div class="flex items-center gap-3 text-secondary text-xs">
                    <span class="flex items-center gap-1">
                        <i class="bi bi-clock-fill"></i>
                        {{ game.gameAvgDuration }} mins
                    </span>
                    <span class="flex items-center gap-1">
                        <i class="bi bi-people-fill"></i>
                        {{ game.minPlayers }} - {{ game.maxPlayers }}
                    </span>
                </div>
            </div>
        </a>

        <!-- Second row wrapper -->
        <div class="flex items-center gap-3 justify-between sm:justify-end w-full">
            <!-- Rating Stars -->
            <div class="flex items-center gap-0.5">
                @for (star of [2, 4, 6, 8, 10]; track $index) {
                <button
                    (click)="setReview(game.id, star)"
                    (mouseover)="hoverRating = star"
                    (mouseleave)="hoverRating = 0"
                    class="p-0.5 hover:scale-110 transition-transform cursor-pointer"
                >
                    <i
                        class="text-lg {{
                            star <= (hoverRating || review) ? 'bi bi-star-fill text-yellow-400' : 'bi bi-star text-zinc-500'
                        }}"
                    ></i>
                </button>
                }
            </div>
        </div>
    </div>
</div>
