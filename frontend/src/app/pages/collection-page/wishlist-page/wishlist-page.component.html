<app-page-header titleText="Wishlist" [showActionButton]="true">
    Keep track of games you want to add to your collection

    <app-button class="action-button" icon="plus-lg" routerLink="/collection/browse">Explore Games</app-button>
</app-page-header>

<container-wrapper>
    <!-- Loading state -->
    @if (isLoadingWishlist()) {
        <section class="flex flex-wrap gap-4">
            <app-skeleton-card-game />
            <app-skeleton-card-game />
            <app-skeleton-card-game />
        </section>
    } @else if (userWishlist$().length === 0) {
        <!-- no data -->
        <div class="text-center text-secondary">
            <p>No games in your wishlist yet</p>
        </div>
    } @else {
        <section class="flex flex-wrap gap-4">
            @for (game of userWishlist$(); track $index) {
                <div class="relative">
                    <app-card-game
                        [routerLink]="['/games', game.id]"
                        [title]="game.titleTranslations.en"
                        [imageUrl]="game.imageUrl"
                        [gameAvgDuration]="game.gameAvgDuration"
                        [minPlayers]="game.minPlayers"
                        [maxPlayers]="game.maxPlayers"
                    />
                    <div class="absolute -top-2 -right-2 flex gap-2">
                        <!-- Wishlist Button -->
                        <button
                            title="Remove from wishlist"
                            (click)="toggleWishlist(game.id)"
                            class="p-2 rounded-full bg-white/90 shadow-md border border-zinc-200 w-10 h-10 cursor-pointer transition-transform duration-300 ease-linear hover:scale-110 text-rose-500"
                        >
                            <i class="bi bi-heart-fill icon-heart-fill"></i>
                            <i class="bi bi-heartbreak icon-heartbreak"></i>
                        </button>
                    </div>
                </div>
            }
        </section>
    }
</container-wrapper>
