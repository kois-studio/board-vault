<div class="mt-24 lg:mt-48 mb-96 mx-2 max-w-sm md:mx-auto p-2 lg:p-6">
    <div class="shadow-md rounded-lg p-6 bg-zinc-800 relative">
        <!-- TOP RIGHT BUTTONS -->
        <div class="flex gap-4 absolute -top-16 left-0">    
            <button (click)="onGoBack()" class="app-btn-error" title="Cancel editing">
                <i class="bi bi-arrow-left"></i> Back
            </button>
        </div>

        <!-- GROUP CARD -->
        <h2 class="text-xl font-semibold mb-4">Create a new meet</h2>
        <hr />

        <!-- DATA -->
        <div class="pt-8 pb-2">
            <div class="grid gap-4">
                <div>
                    <input
                        type="date"
                        [formControl]="dateForm"
                        [class]="dateClass"
                        class="app-input"
                        [min]="today"
                        required
                    />
                    <div *ngIf="dateForm.invalid && (dateForm.dirty || dateForm.touched)">
                        <div *ngIf="dateForm.hasError('required')" class="text-sm text-red-500 py-1">
                            <i class="bi bi-exclamation-circle-fill"></i> Date is required.
                        </div>
                    </div>
                </div>
                <button class="app-btn-primary" title="Invite user" (click)="onClickCreateMeeting()" [disabled]="disableCreateButton">
                    Create
                </button>
            </div>
        </div>
    </div>
</div>
