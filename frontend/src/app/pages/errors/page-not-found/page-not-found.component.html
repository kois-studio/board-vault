<!-- One centred column at every width; the layout around it gives the header, the footer and the page's <main>. -->
<div class="mx-auto flex min-h-[60vh] max-w-xl flex-col items-center justify-center px-4 py-16 text-center text-bv-text">
    <h1 class="text-3xl font-bold tracking-wider lg:text-5xl" i18n="Heading of the page shown for an address that does not exist">Error 404<br /> Page not found</h1>
    <p class="mt-4 text-bv-text-muted" i18n="Text on the page shown for an address that does not exist">
        Oops, are you lost? <br/> The page you are looking for might have been removed or its name changed.
    </p>
    <a appButton size="large" class="mt-8" [routerLink]="isAuthenticated() ? '/dashboard' : '/'" i18n="Button on the page shown for an address that does not exist">Go back home</a>
</div>
