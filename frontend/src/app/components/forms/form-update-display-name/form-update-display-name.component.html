<div class="w-full flex flex-col md:flex-row justify-between items-start gap-4">
  <div class="flex items-center">
    <form [formGroup]="updateProfileFormGroup">
      <div>
        <input
          type="text"
          formControlName="displayName"
          i18n-aria-label="Accessible name of the display name field in Profile settings" aria-label="Display name"
          [maxLength]="maxLength"
          class="app-input"
          [class]="displayNameClass"
          required
          />
        @if (displayName?.invalid && (displayName?.dirty || displayName?.touched)) {
          <div>
            @if (displayName?.hasError('required')) {
              <div class="text-sm text-bv-danger py-1">
                <app-icon name="circle-alert" [size]="16" />&ngsp;<ng-container i18n="Error under the display name field when it is empty">Display name is required.</ng-container>
              </div>
            }
            @if (displayName?.hasError('maxlength')) {
              <div class="text-sm text-bv-danger py-1">
                <app-icon name="circle-alert" [size]="16" />&ngsp;<ng-container i18n="Error under the display name field when it is too long; the placeholder is the most characters allowed">Use at most {{ maxLength }} characters.</ng-container>
              </div>
            }
          </div>
        }
      </div>
    </form>
  </div>

  @if (!isEditing){
    <button appButton variant="secondary" (click)="toggleEditing()" i18n="Button in Profile settings that lets you edit your display name">Change display name</button>
    }@else {
    <div class="flex gap-4">
      <button appButton variant="secondary" (click)="onCancel()" i18n="Button that stops editing your display name without saving">Cancel</button>
      <button appButton variant="primary" [disabled]="disableSubmit" (click)="onSave()" i18n="Button that saves your new display name">Save</button>
    </div>
  }
</div>
