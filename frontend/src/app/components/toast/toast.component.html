<div class="fixed inset-x-4 bottom-5 z-50 flex flex-col items-end gap-3 sm:left-auto" aria-live="polite" aria-atomic="false">
    @for (toast of toastService.toasts; track toast.id) {
    <div class="animate-toast-enter w-full max-w-sm motion-reduce:animate-none">
        <div
            class="relative rounded-lg border border-l-4 border-bv-border bg-bv-surface p-4 text-bv-text shadow-lg"
            [attr.role]="toast.type === 'error' || toast.type === 'warning' ? 'alert' : 'status'"
            [ngClass]="{
                'border-l-bv-danger': toast.type === 'error',
                'border-l-bv-warning': toast.type === 'warning',
                'border-l-bv-primary': toast.type === 'info',
                'border-l-bv-success': toast.type === 'success',
                'border-l-bv-text-muted': toast.type === 'generic'
            }"
        >
            <div class="flex justify-between items-center">
                <app-icon
                    [name]="iconFor(toast.type)"
                    [size]="20"
                    [className]="{ error: 'text-bv-danger', warning: 'text-bv-warning', info: 'text-bv-primary', success: 'text-bv-success', generic: 'text-bv-text-muted' }[toast.type]"
                    aria-hidden="true"
                />

                <span class="flex-1 px-4">{{ toast.message }}</span>
                <button type="button" (click)="closeToast(toast.id)" class="rounded p-1 text-bv-text-muted hover:bg-bv-surface-2 hover:text-bv-text" aria-label="Dismiss notification">
                    <app-icon name="x" [size]="16" aria-hidden="true" />
                </button>
            </div>
            <div
                class="h-1 absolute bottom-1 m-auto opacity-0 rounded-full bg-gradient-to-r origin-left animate-toast-progress"
                [ngStyle]="{ 'width': 'calc(100% - 2rem)' }"
                [ngClass]="{
                    'from-bv-danger/20 to-bv-danger': toast.type === 'error',
                    'from-bv-warning/20 to-bv-warning': toast.type === 'warning',
                    'from-bv-primary/20 to-bv-primary': toast.type === 'info',
                    'from-bv-success/20 to-bv-success': toast.type === 'success',
                    'from-bv-text-muted/20 to-bv-text-muted': toast.type === 'generic'
                }"
            ></div>
        </div>
    </div>
    }
</div>
