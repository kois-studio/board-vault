<div class="fixed bottom-5 right-5">
    @for (toast of toastService.toasts; track $index) {
    <div class="w-80 animate__animated animate__fadeIn">
        <div
            class="text-white border-l-4 p-4 mb-4 rounded-lg shadow-lg flex justify-between items-center"
            [ngClass]="{
                'bg-red-500 border-red-700 shadow-red-700': toast.type === 'error',
                'bg-orange-500 border-orange-700 shadow-orange-700': toast.type === 'warning',
                'bg-blue-500 border-blue-700 shadow-blue-700': toast.type === 'info',
                'bg-green-500 border-green-700 shadow-green-700': toast.type === 'success',
                'bg-gray-500 border-gray-700 shadow-gray-700': toast.type === 'generic'
            }"
        >
            <i *ngIf="toast.type === 'error'" class="bi bi-exclamation-triangle-fill"></i>
            <i *ngIf="toast.type === 'warning'" class="bi bi-exclamation-circle-fill"></i>
            <i *ngIf="toast.type === 'info'" class="bi bi-info-circle-fill"></i>
            <i *ngIf="toast.type === 'success'" class="bi bi-check-circle-fill"></i>
            <i *ngIf="toast.type === 'generic'" class="bi bi-info-circle-fill"></i>
            
            <span>{{ toast.message }}</span>
            <button (click)="closeToast($index)" class="ml-4 text-white">&times;</button>
        </div>
    </div>
    }
</div>
