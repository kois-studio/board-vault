<div class="relative inline-block" (mouseenter)="showTooltip()" (mouseleave)="hideTooltip()">
    <ng-content></ng-content>

    @if (isVisible) {
    <div
        [id]="tooltipId"
        class="absolute z-10 whitespace-nowrap rounded bg-bv-text px-2 py-1 text-sm text-bv-surface transition-opacity duration-200 motion-reduce:transition-none"
        [ngClass]="{
            'bottom-full': position() === 'top',
            'top-full': position() === 'bottom',
            'left-full': position() === 'right',
            'right-full': position() === 'left',

            'left-1/2': position() === 'top' || position() === 'bottom',
            '-translate-x-1/2': position() === 'top' || position() === 'bottom',

            'top-1/2': position() === 'left' || position() === 'right',
            '-translate-y-1/2': position() === 'left' || position() === 'right',

            'mb-2': position() === 'top',
            'mt-2': position() === 'bottom',
            'ml-2': position() === 'right',
            'mr-2': position() === 'left'
        }"
        role="tooltip"
    >
        {{ text() }}

        <div
            class="absolute w-0 h-0 border-8 border-solid border-transparent"
            [ngClass]="{
                'top-full': position() === 'top',
                'bottom-full': position() === 'bottom',
                'right-full': position() === 'right',
                'left-full': position() === 'left',

                'left-1/2': position() === 'top' || position() === 'bottom',
                '-translate-x-1/2': position() === 'top' || position() === 'bottom',

                'top-1/2': position() === 'left' || position() === 'right',
                '-translate-y-1/2': position() === 'left' || position() === 'right',

                'border-t-bv-text-muted': position() === 'top',
                'border-b-bv-text-muted': position() === 'bottom',
                'border-r-bv-text-muted': position() === 'right',
                'border-l-bv-text-muted': position() === 'left'
            }"
        ></div>
    </div>
    }
</div>
