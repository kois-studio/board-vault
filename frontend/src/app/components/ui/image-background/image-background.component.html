<div
    class="flex h-full w-full items-center justify-center overflow-hidden rounded bg-bv-surface-2"
    [attr.role]="src() && !hasError() ? null : 'img'"
    [attr.aria-label]="src() && !hasError() ? null : alt() + ' unavailable'"
>
    @if (src() && !hasError()) {
        <img
            class="h-full w-full object-contain"
            [src]="src()"
            [alt]="alt()"
            [loading]="loading()"
            decoding="async"
            (error)="handleImageError()"
        />
    } @else {
        <span class="px-2 text-center text-xs text-bv-text-muted">Artwork unavailable</span>
    }
</div>
