<span
    class="text-sm font-medium px-2.5 py-0.5 rounded-full flex items-center"
    [ngClass]="{
        'bg-indigo-200 dark:bg-indigo-900/30 text-indigo-800 dark:text-indigo-300': color === 'indigo',
        'bg-red-200 dark:bg-red-900/30 text-red-800 dark:text-red-300': color === 'red',
        'bg-green-200 dark:bg-green-900/30 text-green-800 dark:text-green-300': color === 'green',
        'bg-blue-200 dark:bg-blue-900/30 text-blue-800 dark:text-blue-300': color === 'blue',
        'bg-gray-200 dark:bg-gray-900/30 text-gray-800 dark:text-gray-300': color === 'gray',
        'bg-orange-200 dark:bg-orange-900/30 text-orange-800 dark:text-orange-300': color === 'orange',
    }"
>
    @if (showIndicator) {
        <span
            [ngClass]="{
                'w-2 h-2 rounded-full mr-1 block': true,
                'bg-indigo-500': color === 'indigo',
                'bg-red-500': color === 'red',
                'bg-green-500': color === 'green',
                'bg-blue-500': color === 'blue',
                'bg-gray-500': color === 'gray'
            }"
        ></span>
    }
    {{ text }}
</span>
