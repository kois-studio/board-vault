<span class="text-sm font-medium px-2.5 py-0.5 rounded-full flex items-center" [ngClass]="{
    'bg-red-200     dark:bg-red-900/50      text-red-800     dark:text-red-100     ': color === 'red',
    'bg-orange-200  dark:bg-orange-900/50   text-orange-800  dark:text-orange-100  ': color === 'orange',
    'bg-amber-200   dark:bg-amber-900/50    text-amber-800   dark:text-amber-100   ': color === 'amber',
    'bg-yellow-200  dark:bg-yellow-900/50   text-yellow-800  dark:text-yellow-100  ': color === 'yellow',
    'bg-lime-200    dark:bg-lime-900/50     text-lime-800    dark:text-lime-100    ': color === 'lime',
    'bg-green-200   dark:bg-green-900/50    text-green-800   dark:text-green-100   ': color === 'green',
    'bg-emerald-200 dark:bg-emerald-900/50  text-emerald-800 dark:text-emerald-100 ': color === 'emerald',
    'bg-teal-200    dark:bg-teal-900/50     text-teal-800    dark:text-teal-100    ': color === 'teal',
    'bg-cyan-200    dark:bg-cyan-900/50     text-cyan-800    dark:text-cyan-100    ': color === 'cyan',
    'bg-sky-200     dark:bg-sky-900/50      text-sky-800     dark:text-sky-100     ': color === 'sky',
    'bg-blue-200    dark:bg-blue-900/50     text-blue-800    dark:text-blue-100    ': color === 'blue',
    'bg-indigo-200  dark:bg-indigo-900/50   text-indigo-800  dark:text-indigo-100  ': color === 'indigo',
    'bg-violet-200  dark:bg-violet-900/50   text-violet-800  dark:text-violet-100  ': color === 'violet',
    'bg-purple-200  dark:bg-purple-900/50   text-purple-800  dark:text-purple-100  ': color === 'purple',
    'bg-fuchsia-200 dark:bg-fuchsia-900/50  text-fuchsia-800 dark:text-fuchsia-100 ': color === 'fuchsia',
    'bg-pink-200    dark:bg-pink-900/50     text-pink-800    dark:text-pink-100    ': color === 'pink',
    'bg-rose-200    dark:bg-rose-900/50     text-rose-800    dark:text-rose-100    ': color === 'rose',
    'bg-slate-200   dark:bg-slate-900/50    text-slate-800   dark:text-slate-100   ': color === 'slate',
    'bg-gray-200    dark:bg-gray-900/50     text-gray-800    dark:text-gray-100    ': color === 'gray',
    'bg-zinc-200    dark:bg-zinc-900/50     text-zinc-800    dark:text-zinc-100    ': color === 'zinc',
    'bg-neutral-200 dark:bg-neutral-900/50  text-neutral-800 dark:text-neutral-100 ': color === 'neutral',
    'bg-stone-200   dark:bg-stone-900/50    text-stone-800   dark:text-stone-100   ': color === 'stone',
}">
    @if (showIndicator) {
        <span class="mr-1 block h-2 w-2 rounded-full" [ngClass]="indicatorClass" aria-hidden="true"></span>
    }
    {{ text }}
</span>
