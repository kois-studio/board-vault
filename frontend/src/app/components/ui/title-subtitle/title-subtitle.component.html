<div class="relative">
    <div class="flex items-center justify-center">
        <h1 class="px-4 pb-8 pt-16 text-center text-4xl font-bold">{{ titleText }}</h1>

        @if (helpText) {
            <button
                type="button"
                (click)="toggleHelp()"
                class="ml-2 rounded-full p-1 text-zinc-400 hover:text-zinc-700 focus-visible:outline-none dark:hover:text-zinc-200"
                aria-label="Show help information"
                aria-controls="title-help-popover"
                [attr.aria-expanded]="isHelpVisible"
            >
                <app-icon name="circle-help" [size]="18" />
            </button>
        }
    </div>

    @if (isHelpVisible && helpText) {
        <div
            id="title-help-popover"
            class="absolute left-0 right-0 z-10 mx-auto mt-2 max-w-xs rounded-md border border-zinc-200 bg-white p-4 text-sm text-zinc-700 shadow-lg dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-200"
            role="note"
        >
            <div class="flex items-start justify-between gap-3">
                <div>{{ helpText }}</div>
                <button
                    type="button"
                    (click)="closeHelp()"
                    class="rounded p-1 text-zinc-400 hover:text-zinc-600 focus-visible:outline-none dark:hover:text-zinc-200"
                    aria-label="Close help"
                >
                    <app-icon name="x" [size]="16" />
                </button>
            </div>
        </div>
    }

    <div class="text-secondary px-4 pb-8 text-center">
        <ng-content />
    </div>
</div>
