<div class="relative">
    <div class="flex justify-center items-center">
        <h1 class="text-4xl text-center font-bold pt-16 pb-8 px-4">{{ titleText }}</h1>

        @if (helpText) {
        <button (click)="toggleHelp()" class="ml-2 text-zinc-400 hover:text-zinc-600 focus:outline-none" aria-label="Help information">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path
                    fill-rule="evenodd"
                    d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z"
                    clip-rule="evenodd"
                />
            </svg>
        </button>
        }
    </div>

    <!-- Help Popup -->
    @if (isHelpVisible && helpText) {
    <div
        class="absolute z-10 bg-white shadow-lg rounded-md p-4 max-w-xs right-0 left-0 mx-auto mt-2 text-sm text-gray-700 border border-gray-200"
    >
        <div class="flex justify-between items-start">
            <div [innerHTML]="helpText"></div>
            <button (click)="closeHelp()" class="text-gray-400 hover:text-gray-600 focus:outline-none" aria-label="Close help">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                    <path
                        fill-rule="evenodd"
                        d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                        clip-rule="evenodd"
                    />
                </svg>
            </button>
        </div>
    </div>
    }

    <div class="text-zinc-400 text-center pb-8 px-4">
        <ng-content />
    </div>
</div>
