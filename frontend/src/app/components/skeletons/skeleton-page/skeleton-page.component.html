<container-wrapper>
    <div class="space-y-8 pb-16 pt-6 motion-safe:animate-pulse lg:pt-8" aria-hidden="true" data-testid="page-skeleton">
        <div class="space-y-3">
            <div class="h-8 w-56 max-w-full rounded-lg bg-bv-surface-2 lg:h-9"></div>
            <div class="h-4 w-80 max-w-full rounded bg-bv-surface-2"></div>
        </div>
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            @for (card of cards; track card) {
            <div class="rounded-2xl border border-bv-border bg-bv-surface p-6">
                <div class="h-5 w-3/4 rounded bg-bv-surface-2"></div>
                <div class="mt-4 space-y-3">
                    <div class="h-4 w-1/2 rounded bg-bv-surface-2"></div>
                    <div class="h-4 w-1/3 rounded bg-bv-surface-2"></div>
                </div>
            </div>
            }
        </div>
        <div class="divide-y divide-bv-border rounded-2xl border border-bv-border bg-bv-surface">
            @for (row of rows; track row) {
            <div class="flex items-center gap-4 p-4">
                <div class="h-10 w-10 shrink-0 rounded-lg bg-bv-surface-2"></div>
                <div class="flex-1 space-y-2">
                    <div class="h-4 w-2/5 rounded bg-bv-surface-2"></div>
                    <div class="h-3 w-1/4 rounded bg-bv-surface-2"></div>
                </div>
            </div>
            }
        </div>
    </div>
</container-wrapper>
