<!-- In the shape of app-card-group (#261): the coloured band with the name, the counts and the faces, then the three shortcuts. -->
<div class="overflow-hidden rounded-2xl border border-bv-border bg-bv-surface shadow-sm motion-safe:animate-pulse lg:grid lg:grid-cols-[18rem_1fr]">
    <div class="bg-bv-primary p-5 lg:p-6">
        <div class="flex h-8 items-center lg:h-9"><div class="h-6 w-40 max-w-full rounded bg-bv-on-primary/25"></div></div>
        <div class="mt-3 flex flex-wrap items-center gap-x-3 gap-y-2 lg:flex-col lg:items-start">
            <div class="flex">
                @for (face of faces; track face) {
                    <div class="-ml-2 h-7 w-7 rounded-full bg-bv-on-primary/25 ring-2 ring-bv-primary first:ml-0"></div>
                }
            </div>
            <div class="flex h-5 items-center lg:order-first"><div class="h-3 w-28 rounded bg-bv-on-primary/25"></div></div>
        </div>
    </div>
    <div class="flex flex-col justify-center gap-3 p-3 lg:p-4">
        <div class="grid grid-cols-3 gap-2">
            @for (shortcut of shortcuts; track shortcut) {
                <div class="flex flex-col items-center gap-1.5 rounded-xl bg-bv-bg px-2 py-3 lg:py-4">
                    <div class="h-5 w-5 rounded bg-bv-border"></div>
                    <div class="flex h-5 items-center"><div class="h-3 w-16 max-w-full rounded bg-bv-border"></div></div>
                </div>
            }
        </div>
    </div>
</div>
