<div class="flex flex-col items-center p-2 max-w-md mx-auto">
    <!-- Avatar Preview -->
    <div class="mb-6 text-center">
        <h2 class="text-xl font-semibold mb-3">Avatar Preview</h2>
        <div class="flex items-center justify-center">
            <app-image-profile [avatar]="avatar" size="large" />
        </div>
    </div>

    <!-- Color Selection -->
    <div class="w-full mb-6">
        <h3 class="text-lg font-medium mb-2">Background Color</h3>
        <div class="grid grid-cols-6 gap-2">
            @for (color of colorPalette; track color) {
            <button
                [style.background-color]="color"
                class="w-10 h-10 rounded-full motion-safe:transition-transform motion-safe:hover:scale-110 duration-200 shadow-sm"
                [class.ring-2]="color === avatar.backgroundColor"
                [class.ring-offset-2]="color === avatar.backgroundColor"
                [class.ring-blue-500]="color === avatar.backgroundColor"
                (click)="selectColor(color)"
                [attr.aria-label]="'Choose avatar background color ' + color"
            ></button>
            }
        </div>
    </div>

    <!-- Avatar Type Tabs -->
    <div class="w-full mb-4">
        <div class="flex border-b border-gray-200">
            <button
                (click)="switchTab('icon')"
                class="py-2 px-4 font-medium transition-colors duration-200 cursor-pointer"
                [ngClass]="{
                    'text-black dark:text-white border-b-2 border-black dark:border-white': activeTab === 'icon',
                    'text-gray-700 dark:text-gray-500': activeTab !== 'icon',
                }"
            >
                Icon
            </button>
            <button
                (click)="switchTab('emoji')"
                class="py-2 px-4 font-medium transition-colors duration-200 cursor-pointer"
                [ngClass]="{
                    'text-black dark:text-white border-b-2 border-black dark:border-white': activeTab === 'emoji',
                    'text-gray-700 dark:text-gray-500': activeTab !== 'emoji',
                }"
            >
                Emoji
            </button>
            <button
                (click)="switchTab('initials')"
                class="py-2 px-4 font-medium transition-colors duration-200 cursor-pointer"
                [ngClass]="{
                    'text-black dark:text-white border-b-2 border-black dark:border-white': activeTab === 'initials',
                    'text-gray-700 dark:text-gray-500': activeTab !== 'initials',
                }"
            >
                Initials
            </button>
        </div>
    </div>

    <!-- Icon Selection -->
    @if (activeTab === 'icon') {
    <div class="w-full">
        <!-- Search box -->
        <!-- <div class="mb-3">
            <input
                type="text"
                [(ngModel)]="searchTerm"
                placeholder="Search icons..."
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
        </div> -->

        <!-- Icons grid -->
        <div class="grid grid-cols-5 gap-3 max-h-64 overflow-y-auto p-2">
            @for (icon of filteredIcons; track icon) {
            <button
                (click)="selectIcon(icon)"
                [attr.aria-label]="'Choose ' + icon + ' avatar icon'"
                class="h-12 w-12 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors duration-200 cursor-pointer"
                [class.bg-blue-100]="avatar.iconName === icon"
            >
                <app-icon [name]="icon" [size]="28" />
            </button>
            }
        </div>
    </div>
    }

    <!-- Emoji Selection -->
    @if (activeTab === 'emoji') {
    <div class="w-full">
        <div class="grid grid-cols-5 gap-3 max-h-64 overflow-y-auto p-2">
            @for (emoji of emojis; track emoji) {
            <button
                (click)="selectEmoji(emoji)"
                class="h-12 w-12 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors duration-200 text-2xl cursor-pointer"
                [class.bg-blue-100]="avatar.emoji === emoji"
            >
                {{ emoji }}
            </button>
            }
        </div>
    </div>
    }

    <!-- Initials Input -->
    @if (activeTab === 'initials') {
    <div class="w-full">
        <div class="mb-4">
            <label class="block mb-1">Your Initials</label>
            <input
                type="text"
                [(ngModel)]="avatar.initials"
                (input)="setInitials(avatar.initials || '')"
                maxlength="2"
                placeholder="AB"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
            <p class="mt-1 text-sm text-gray-700 dark:text-gray-400">Maximum 2 characters</p>
        </div>
    </div>
    }
</div>
