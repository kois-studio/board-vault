<div class="flex flex-col items-center p-6 max-w-md mx-auto bg-zinc-800 rounded-lg shadow-md">
    <!-- Avatar Preview -->
    <div class="mb-6 text-center">
        <h2 class="text-xl font-semibold mb-3">Avatar Preview</h2>
        <div
            class="w-24 h-24 rounded-full flex items-center justify-center text-white text-3xl overflow-hidden border-4 border-white shadow-lg"
            [style.background-color]="avatarConfig.backgroundColor"
        >
            <ng-container *ngIf="avatarConfig.type === 'icon' && avatarConfig.iconName">
                <i class="bi bi-{{ avatarConfig.iconName }}"></i>
            </ng-container>

            <ng-container *ngIf="avatarConfig.type === 'emoji' && avatarConfig.emoji">
                <span class="text-3xl">{{ avatarConfig.emoji }}</span>
            </ng-container>

            <ng-container *ngIf="avatarConfig.type === 'initials'">
                <span class="text-xl font-bold">{{ avatarConfig.initials || 'AB' }}</span>
            </ng-container>
        </div>
    </div>

    <!-- Color Selection -->
    <div class="w-full mb-6">
        <h3 class="text-lg font-medium mb-2">Background Color</h3>
        <div class="grid grid-cols-6 gap-2">
            <button
                *ngFor="let color of colorPalette"
                [style.background-color]="color"
                class="w-10 h-10 rounded-full hover:scale-110 transition-transform duration-200 shadow-sm"
                [class.ring-2]="color === avatarConfig.backgroundColor"
                [class.ring-offset-2]="color === avatarConfig.backgroundColor"
                [class.ring-blue-500]="color === avatarConfig.backgroundColor"
                (click)="selectColor(color)"
            ></button>
        </div>
    </div>

    <!-- Avatar Type Tabs -->
    <div class="w-full mb-4">
        <div class="flex border-b border-gray-200">
            <button
                (click)="switchTab('icon')"
                class="py-2 px-4 font-medium transition-colors duration-200"
                [class.text-blue-600]="activeTab === 'icon'"
                [class.border-b-2]="activeTab === 'icon'"
                [class.border-blue-600]="activeTab === 'icon'"
                [class.text-gray-500]="activeTab !== 'icon'"
            >
                Icon
            </button>
            <button
                (click)="switchTab('emoji')"
                class="py-2 px-4 font-medium transition-colors duration-200"
                [class.text-blue-600]="activeTab === 'emoji'"
                [class.border-b-2]="activeTab === 'emoji'"
                [class.border-blue-600]="activeTab === 'emoji'"
                [class.text-gray-500]="activeTab !== 'emoji'"
            >
                Emoji
            </button>
            <button
                (click)="switchTab('initials')"
                class="py-2 px-4 font-medium transition-colors duration-200"
                [class.text-blue-600]="activeTab === 'initials'"
                [class.border-b-2]="activeTab === 'initials'"
                [class.border-blue-600]="activeTab === 'initials'"
                [class.text-gray-500]="activeTab !== 'initials'"
            >
                Initials
            </button>
        </div>
    </div>

    <!-- Icon Selection -->
    <div *ngIf="activeTab === 'icon'" class="w-full">
        <!-- Search box -->
        <div class="mb-3">
            <input
                type="text"
                [(ngModel)]="searchTerm"
                placeholder="Search icons..."
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
        </div>

        <!-- Icons grid -->
        <div class="grid grid-cols-5 gap-3 max-h-64 overflow-y-auto p-2">
            <button
                *ngFor="let icon of filteredIcons"
                (click)="selectIcon(icon)"
                class="h-12 w-12 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors duration-200"
                [class.bg-blue-100]="avatarConfig.iconName === icon"
            >
                <i class="bi bi-{{ icon }} text-2xl"></i>
            </button>
        </div>
    </div>

    <!-- Emoji Selection -->
    <div *ngIf="activeTab === 'emoji'" class="w-full">
        <div class="grid grid-cols-5 gap-3 max-h-64 overflow-y-auto p-2">
            <button
                *ngFor="let emoji of emojis"
                (click)="selectEmoji(emoji)"
                class="h-12 w-12 flex items-center justify-center rounded-lg hover:bg-gray-100 transition-colors duration-200 text-2xl"
                [class.bg-blue-100]="avatarConfig.emoji === emoji"
            >
                {{ emoji }}
            </button>
        </div>
    </div>

    <!-- Initials Input -->
    <div *ngIf="activeTab === 'initials'" class="w-full">
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Your Initials</label>
            <input
                type="text"
                [(ngModel)]="avatarConfig.initials"
                (input)="setInitials(avatarConfig.initials || '')"
                maxlength="2"
                placeholder="AB"
                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500"
            />
            <p class="mt-1 text-sm text-gray-500">Maximum 2 characters</p>
        </div>
    </div>
</div>
