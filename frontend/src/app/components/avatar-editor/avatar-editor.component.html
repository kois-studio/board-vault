<div class="flex flex-col items-center p-2 max-w-md mx-auto">
    <!-- Avatar Preview -->
    <div class="mb-6 text-center">
        <h2 class="text-xl font-semibold mb-3">Avatar Preview</h2>
        <div class="flex items-center justify-center">
            <app-image-profile [avatar]="draft()" size="large" />
        </div>
    </div>

    <!-- Color Selection -->
    <div class="w-full mb-6">
        <h3 class="text-lg font-medium mb-2">Background Color</h3>
        <div class="grid grid-cols-4 gap-2 sm:grid-cols-8">
            @for (color of colorPalette; track color) {
            <button
                type="button"
                [style.background-color]="swatchColour(color)"
                class="h-10 w-10 rounded-full shadow-sm ring-offset-bv-surface duration-200 motion-safe:transition-transform motion-safe:hover:scale-110"
                [class.ring-2]="color === draft().backgroundColor"
                [class.ring-offset-2]="color === draft().backgroundColor"
                [class.ring-bv-primary]="color === draft().backgroundColor"
                (click)="selectColor(color)"
                [attr.aria-label]="'Choose player colour ' + ($index + 1)"
                [attr.aria-pressed]="color === draft().backgroundColor"
            ></button>
            }
        </div>
    </div>

    <!-- Avatar Type Tabs -->
    <div class="w-full mb-4">
        <div class="flex border-b border-bv-border">
            <button
                (click)="switchTab('icon')"
                class="py-2 px-4 font-medium transition-colors duration-200 cursor-pointer"
                [ngClass]="{
                    'text-bv-primary border-b-2 border-bv-primary': activeTab === 'icon',
                    'text-bv-text-muted': activeTab !== 'icon',
                }"
            >
                Icon
            </button>
            <button
                (click)="switchTab('emoji')"
                class="py-2 px-4 font-medium transition-colors duration-200 cursor-pointer"
                [ngClass]="{
                    'text-bv-primary border-b-2 border-bv-primary': activeTab === 'emoji',
                    'text-bv-text-muted': activeTab !== 'emoji',
                }"
            >
                Emoji
            </button>
            <button
                (click)="switchTab('initials')"
                class="py-2 px-4 font-medium transition-colors duration-200 cursor-pointer"
                [ngClass]="{
                    'text-bv-primary border-b-2 border-bv-primary': activeTab === 'initials',
                    'text-bv-text-muted': activeTab !== 'initials',
                }"
            >
                Initials
            </button>
        </div>
    </div>

    <!-- Icon Selection -->
    @if (activeTab === 'icon') {
    <div class="w-full">
        <!-- Search box -->
        <!-- <div class="mb-3">
            <input
                type="text"
                [(ngModel)]="searchTerm"
                placeholder="Search icons..."
                class="w-full px-3 py-2 border border-bv-border rounded-md focus:outline-none focus:ring-1 focus:ring-bv-primary"
            />
        </div> -->

        <!-- Icons grid -->
        <div class="grid grid-cols-5 gap-3 max-h-64 overflow-y-auto p-2">
            @for (icon of filteredIcons; track icon) {
            <button
                (click)="selectIcon(icon)"
                [attr.aria-label]="'Choose ' + icon + ' avatar icon'"
                class="h-12 w-12 flex items-center justify-center rounded-lg hover:bg-bv-surface-2 transition-colors duration-200 cursor-pointer"
                [class.bg-bv-primary-soft]="draft().iconName === icon"
            >
                <app-icon [name]="icon" [size]="28" />
            </button>
            }
        </div>
    </div>
    }

    <!-- Emoji Selection -->
    @if (activeTab === 'emoji') {
    <div class="w-full">
        <div class="grid grid-cols-5 gap-3 max-h-64 overflow-y-auto p-2">
            @for (emoji of emojis; track emoji) {
            <button
                (click)="selectEmoji(emoji)"
                class="h-12 w-12 flex items-center justify-center rounded-lg hover:bg-bv-surface-2 transition-colors duration-200 text-2xl cursor-pointer"
                [class.bg-bv-primary-soft]="draft().emoji === emoji"
            >
                {{ emoji }}
            </button>
            }
        </div>
    </div>
    }

    <!-- Initials Input -->
    @if (activeTab === 'initials') {
    <div class="w-full">
        <div class="mb-4">
            <label class="block mb-1">Your Initials</label>
            <input
                type="text"
                [ngModel]="draft().initials"
                (ngModelChange)="setInitials($event || '')"
                maxlength="2"
                placeholder="AB"
                class="w-full px-3 py-2 border border-bv-border rounded-md focus:outline-none focus:ring-1 focus:ring-bv-primary"
            />
            <p class="mt-1 text-sm text-bv-text-muted">Maximum 2 characters</p>
        </div>
    </div>
    }
</div>
