<!-- Profile Picture and Dropdown Trigger -->
<div class="relative">
    <button (click)="toggleDropdown()">
        <app-image-profile [imageUrl]="userData?.imageUrl" />
    </button>

    <!-- Dropdown Menu -->
    @if (isDropdownVisible) {
    <div class="absolute right-0 mt-2 w-56 bg-zinc-900 border border-zinc-700 rounded-lg shadow-xl">
        <div class="flex items-center p-4">
            <app-image-profile [imageUrl]="userData?.imageUrl" />
            <div class="ml-3">
                <p class="font-semibold text-white">{{ userData?.display_name }}</p>
                <p class="text-gray-400 text-sm">{{ userData?.username }}</p>
            </div>
        </div>
        <div class="border-t border-zinc-700">
            <button (click)="onClickProfileSettings()" class="flex items-center gap-2 w-full px-4 py-2 text-left text-white hover:bg-zinc-800 border-b border-zinc-700">
                <i class="bi bi-gear"></i> Manage account
            </button>
            <button (click)="onClickNotifications()" class="flex items-center gap-2 w-full px-4 py-2 text-left text-white hover:bg-zinc-800 border-b border-zinc-700">
                <i class="bi bi-bell"></i> Notifications
            </button>
            <button (click)="onClickSignOut()" class="flex items-center gap-2 w-full px-4 py-2 text-left text-white hover:bg-zinc-800">
                <i class="bi bi-box-arrow-right"></i> Sign out
            </button>
        </div>
    </div>
    }
</div>

<app-profile-settings />
