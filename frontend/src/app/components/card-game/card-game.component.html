<div class="flex flex-col rounded-lg bg-zinc-100 dark:bg-zinc-800 shadow-md hover:shadow-lg transition-shadow cursor-pointer w-40">
    <image-background class="aspect-square rounded-t-lg overflow-hidden" [src]="imageUrl" />

    <div class="overflow-hidden px-4 py-2">
        <h3 class="font-medium overflow-hidden text-ellipsis whitespace-nowrap">{{ title }}</h3>
        <p class="text-secondary text-sm"><i class="bi bi-clock-fill"></i> {{ gameAvgDuration }} mins</p>
        <p class="text-secondary text-sm"><i class="bi bi-people-fill"></i> {{ minPlayers }} - {{ maxPlayers }}</p>
        @if (review) {
        <review-display [review]="review" />
        }
    </div>
</div>
