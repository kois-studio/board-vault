<div class="shadow-md rounded-lg p-6 bg-zinc-800 relative">
    <!-- TOP RIGHT BUTTONS -->
    <div class="absolute top-3 right-3">
        <button (click)="onOpenGroup()" class="app-btn-primary py-1 px-2 ml-2" title="View details">
            <i class="bi bi-plus-lg"></i>
        </button>
    </div>

    <!-- GROUP CARD -->
    <h2 class="text-xl font-semibold mb-4">{{ group.name }}</h2>
    <hr />

    <!-- MEMBERS DATA -->
    <h3 class="pt-8 font-bold tracking-wider">Members</h3>
    <ul>
        @for (member of group.members; track $index) {
        <li class="flex justify-between">
            <app-card-account [member]="member" [isOwner]="group.createdBy === member.id" />
            <div class="flex items-center justify-center">has {{ member.games.length }} games</div>
        </li>
        }
    </ul>

    <!-- INVITED MEMBERS -->
    @if (invitations && invitations.length > 0) {
    <hr />
    <h3 class="pt-8 font-bold tracking-wider">Invitations pending</h3>
    <ul class="pb-8 grid md:grid-cols-2">
        @for (invitation of invitations; track $index) {
        <li class="opacity-40">
            <app-card-account [member]="invitation.toAccount" />
        </li>
        }
    </ul>
    }
</div>
