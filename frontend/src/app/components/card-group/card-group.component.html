<button
    routerLink="/groups/{{ group.id }}"
    class="group transition-all duration-300 hover:scale-[1.01] shadow-md hover:shadow-lg rounded-lg overflow-hidden bg-white dark:bg-zinc-800 border border-transparent hover:border-indigo-300 dark:hover:border-indigo-600 block w-full cursor-pointer"
>
    <!-- HEADER -->
    <div class="bg-indigo-600 p-5 text-white flex justify-between items-center">
        <h2 class="text-xl font-bold tracking-wide truncate">{{ group.name }}</h2>
        <div class="bg-white/20 backdrop-blur-sm rounded-full px-3 py-1 text-xs">{{ totalGames.length }} Games</div>
    </div>

    <!-- CONTENT -->
    <div class="p-5">
        <!-- MEMBERS -->
        <div class="mb-4">
            <h3 class="text-sm uppercase font-semibold text-secondary mb-3 flex items-center">
                <i class="bi bi-people-fill mr-2"></i> Members ({{ group.members.length }})
            </h3>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-2">
                @for (member of group.members; track member.id) {
                <div class="bg-zinc-50 dark:bg-zinc-700 rounded-md p-2 flex justify-between items-center">
                    <app-card-account [member]="member" [isOwner]="group.createdBy === member.id" />
                    <span class="text-xs px-2 py-1 bg-zinc-100 dark:bg-zinc-600 rounded-full mr-2">
                        {{ member.games.length }} games
                    </span>
                </div>
                }
            </div>
        </div>

        <!-- INVITATIONS -->
        @if (invitations && invitations.length > 0) {
        <div class="mt-4 pt-4 border-t border-zinc-200 dark:border-zinc-700">
            <h3 class="text-sm uppercase font-semibold text-secondary mb-3 flex items-center">
                <i class="bi bi-envelope mr-2"></i> Pending Invitations ({{ invitations.length }})
            </h3>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-2">
                @for (invitation of invitations; track invitation.id) {
                <div class="bg-zinc-50 dark:bg-zinc-700/50 rounded-md p-2 opacity-70">
                    <app-card-account [member]="invitation.toAccount" />
                </div>
                }
            </div>
        </div>
        }
    </div>

    <!-- FOOTER -->
    <div class="bg-zinc-50 dark:bg-zinc-900/50 p-3 flex flex-col sm:flex-row gap-y-4 justify-between items-center">
        <!-- LAST ACTIVITY -->
        <div class="text-xs text-secondary">
            @if (lastMeetingComputed(); as lastMeeting) {
                <i class="bi bi-calendar-event mr-1"></i> Last session: {{ lastMeeting.meetDate | customDate: true: lastMeeting.timezone }}
            } @else {
                <i class="bi bi-calendar-heart mr-1"></i> No sessions recorded yet
            }
        </div>
        <!-- CALL TO ACTION -->
        <span class="text-indigo-600 dark:text-indigo-400 font-medium text-sm flex items-center group-hover:underline">
            View Group Details <i class="bi bi-arrow-right ml-1 transition-transform group-hover:translate-x-1"></i>
        </span>
    </div>
</button>
