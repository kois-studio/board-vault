@if (!avatar) {
    <div class="rounded-full bg-zinc-900 flex items-center justify-center" [ngClass]="{
        'w-6 h-6': size === 'small',
        'w-10 h-10': size === 'medium',
        'w-20 h-20': size === 'large'
    }">
        <svg class="w-5 h-5 text-zinc-600" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 18">
            <path d="M18 0H2a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2Zm-5.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Zm4.376 10.481A1 1 0 0 1 16 15H4a1 1 0 0 1-.895-1.447l3.5-7A1 1 0 0 1 7.468 6a.965.965 0 0 1 .9.5l2.775 4.757 1.546-1.887a1 1 0 0 1 1.618.1l2.541 4a1 1 0 0 1 .028 1.011Z"/>
        </svg>
    </div>
} @else {
    <div
        class="rounded-full flex items-center justify-center text-white text-3xl overflow-hidden border-4 border-white shadow-lg mx-auto"
        [style.background-color]="avatar.backgroundColor"
        [ngClass]="{
            'w-6 h-6': size === 'small',
            'w-10 h-10': size === 'medium',
            'w-20 h-20': size === 'large'
        }"
    >
        @if (avatar.type === 'icon' && avatar.iconName) {
        <i class="bi bi-{{ avatar.iconName }}"></i>
        } @if (avatar.type === 'emoji' && avatar.emoji) {
        <span class="text-3xl">{{ avatar.emoji }}</span>
        } @if (avatar.type === 'initials') {
        <span class="text-xl font-bold">{{ avatar.initials || 'AB' }}</span>
        }
    </div>
}
