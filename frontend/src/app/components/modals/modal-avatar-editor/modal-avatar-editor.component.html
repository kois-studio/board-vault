<!-- Dialog overlay -->
@if (isVisible()) {
<div class="fixed inset-0 bg-black/50 flex justify-center items-center z-50" (click)="hideDialog()">
    <!-- Dialog box -->
    <div appDialog (dialogClosed)="hideDialog()" class="bg-bv-surface rounded border border-bv-text-muted w-full h-full sm:h-auto sm:w-3/4 max-w-xl relative pt-4" (click)="$event.stopPropagation()">
        <!-- Close button -->
        <button (click)="hideDialog()" aria-label="Close avatar editor" class="py-2 px-4 rounded-lg hover:bg-bv-surface-2 absolute top-2 right-2 cursor-pointer">
            <app-icon name="x" [size]="18" />
        </button>
        <!-- Dialog content -->
        <app-avatar-editor
            [avatar]="currentUser$()?.avatar ?? {
                backgroundColor: '#3B82F6',
                iconName: 'person-fill',
                emoji: null,
                type: 'icon',
                initials: '',
            }"
            (configChange)="updateAvatar($event)">
        </app-avatar-editor>
    </div>
</div>
}
