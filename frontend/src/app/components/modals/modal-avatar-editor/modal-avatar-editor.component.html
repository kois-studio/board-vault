<!-- Dialog overlay -->
@if (isVisible) {
<div class="fixed inset-0 bg-zinc-900/60 flex justify-center items-center z-50" (click)="hideDialog()">
    <!-- Dialog box -->
    <div class="bg-white dark:bg-zinc-800 rounded border border-zinc-700 w-full h-full sm:h-auto sm:w-3/4 max-w-xl relative pt-4" (click)="$event.stopPropagation()">
        <!-- Close button -->
        <button (click)="hideDialog()" aria-label="Close avatar editor" class="py-2 px-4 rounded-lg hover:bg-zinc-200 hover:dark:bg-zinc-900 absolute top-2 right-2 cursor-pointer">
            <app-icon name="x" [size]="18" />
        </button>
        <!-- Dialog content -->
        <app-avatar-editor
            [avatar]="currentUser$()?.avatar ?? {
                backgroundColor: '#3B82F6',
                iconName: 'person-fill',
                emoji: null,
                type: 'icon',
                initials: '',
            }"
            (configChange)="updateAvatar($event)">
        </app-avatar-editor>
    </div>
</div>
}
