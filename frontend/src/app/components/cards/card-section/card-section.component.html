<div
    class="group relative h-full overflow-hidden rounded-xl border shadow-sm transition hover:shadow-md"
    [class]="cardClass()"
    [class.opacity-60]="comingSoon()"
    [class.cursor-not-allowed]="comingSoon()"
>
    @if (comingSoon()) {
        <div class="absolute right-0 top-0 z-10 rounded-bl-lg bg-bv-text px-3 py-1 text-sm font-medium text-bv-surface">Coming Soon</div>
    }

    <a [routerLink]="comingSoon() ? null : cardLink()" [attr.aria-disabled]="comingSoon() || null" class="block h-full p-6">
        <div class="flex h-full items-start">
            <div class="mr-4 flex h-12 w-12 shrink-0 items-center justify-center rounded-lg transition group-hover:scale-105" [class]="iconTileClass()">
                <app-icon [name]="icon()" [size]="28" aria-hidden="true" />
            </div>

            <div class="flex h-full w-full min-w-0 flex-col items-start justify-between">
                <div class="w-full">
                    <div class="mb-2 flex items-center justify-between gap-3">
                        <h2 class="text-xl font-bold text-bv-text">{{ titleText() }}</h2>
                        <ng-content select=".app-card-section-badge" />
                    </div>
                    <p class="text-bv-text-muted">{{ description() }}</p>
                </div>

                <div class="mt-6 flex w-full items-center justify-between gap-3">
                    <ng-content />
                </div>
            </div>
        </div>
    </a>
</div>
