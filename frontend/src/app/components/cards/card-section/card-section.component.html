<div
    class="bg-white dark:bg-zinc-800 rounded-xl shadow-sm border border-zinc-200 dark:border-zinc-700 hover:shadow-md hover:border-indigo-200 dark:hover:border-indigo-800 transition overflow-hidden group"
>
    <a routerLink="{{ cardLink }}" class="block p-6">
        <div class="flex items-start">
            <!-- Icon -->
            <div
                class="w-12 h-12 bg-indigo-100 dark:bg-indigo-900/30 rounded-lg flex items-center justify-center mr-4 group-hover:bg-indigo-200 dark:group-hover:bg-indigo-900/50 transition"
            >
                <i class="bi bi-{{ icon }} text-indigo-600 dark:text-indigo-400"></i>
            </div>

            <!-- Title and description -->
            <div class="flex-1">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-xl font-bold text-zinc-900 dark:text-white">{{ title }}</h2>
                    <ng-content select=".app-card-section-badge" />
                </div>
                <p class="text-zinc-600 dark:text-zinc-300">{{ description }}</p>

                <div class="mt-6 flex justify-between items-center">
                    <!-- Card content -->
                    <ng-content />
                </div>
            </div>
        </div>
    </a>
</div>
