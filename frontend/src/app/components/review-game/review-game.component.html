<!-- Rating Stars -->
 <br/>
 {{ currentReviewComputed()?.review }}
<div class="flex items-center gap-0.5">
    @for (star of [2, 4, 6, 8, 10]; track $index) {
    <button
        (click)="setReview(star)"
        (mouseover)="reviewValue = star"
        (mouseleave)="reviewValue = 0"
        class="p-0.5 hover:scale-110 transition-transform cursor-pointer"
    >
        <i class="text-lg {{ star <= reviewValue ? 'bi bi-star-fill text-yellow-400' : 'bi bi-star text-zinc-500' }}"></i>
    </button>
    }
</div>
