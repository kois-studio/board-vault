name: Bug report
description: Something in Board Vault does not work as expected.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Board Vault. Please never paste passwords, tokens,
        `.env` values, or real people's email addresses. Use the `+clerk_test`
        fixture accounts when you describe steps.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you saw. Include the exact error text if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as organizer+clerk_test@example.com
        2. Open /groups
        3. ...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where did it happen?
      options:
        - Local (my own checkout and SQLite database)
        - Shared development database
        - Production (board-vault.com)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or branch
      description: Output of `git rev-parse --short HEAD`, if you ran it locally.
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or logs
      description: Remove tokens, emails, and other personal data first.
