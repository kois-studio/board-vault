# Monthly and capped so the queue stays reviewable by a small team.
# Security updates are not affected by the schedule; GitHub opens them as
# soon as an advisory applies.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # NestJS 12 ships ESM-only packages, which Vercel's runtime cannot require
    # from our CommonJS build; TypeScript majors follow Nest. Both wait for
    # the ESM migration tracked in issue #50.
    ignore:
      - dependency-name: "@nestjs/*"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      # Nest packages only install at matching majors; one PR for all of them.
      nestjs:
        applies-to: version-updates
        patterns:
          - "@nestjs/*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # TypeScript majors follow Angular's supported range; move them with
    # `ng update`, not on their own.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
