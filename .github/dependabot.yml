# Monthly and capped so the queue stays reviewable by a small team.
# Security updates are not affected by the schedule; GitHub opens them as
# soon as an advisory applies.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # TypeScript majors wait for the toolchain: typescript-eslint and the Nest
    # CLI support TypeScript 6.0 only, and TypeScript 7 has no stable compiler
    # API yet (issue #50).
    # @types/node majors follow the Node runtime (24: .nvmrc, engines, Vercel),
    # not the newest Node release.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      # Nest packages only install at matching majors; one PR for all of them.
      nestjs:
        applies-to: version-updates
        patterns:
          - "@nestjs/*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # TypeScript majors follow Angular's supported range; move them with
    # `ng update`, not on their own. @types/node majors follow the Node runtime
    # (24), not the newest Node release.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      angular:
        applies-to: version-updates
        patterns:
          - "@angular/*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
