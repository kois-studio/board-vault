name: Board Vault validation

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: validation-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    repository:
        name: Repository checks
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Check patch whitespace
              run: git diff --check

    backend:
        name: Backend tests and build
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: backend/package-lock.json
            - name: Install dependencies
              run: npm ci --ignore-scripts
            - name: Run unit tests
              run: npm test -- --runInBand
            - name: Run backend lint
              run: npx eslint "{src,apps,libs,test}/**/*.ts"
            - name: Check log boundary
              run: npm run lint:logs
            - name: Run HTTP E2E tests
              run: npm run test:e2e -- --runInBand
            - name: Build backend
              run: npm run build
            - name: Check committed OpenAPI snapshot
              run: >-
                  TURSO_DATABASE_URL='file:/tmp/board-vault-openapi.db'
                  TURSO_AUTH_TOKEN='local'
                  JWT_SECRET='local-secret'
                  UPSTASH_REDIS_REST_DISABLE='true'
                  CLERK_SECRET_KEY='sk_test_local'
                  RESEND_API_KEY='re_local'
                  npm run docs:openapi
                  && git diff --exit-code -- ../docs/api/openapi.json

    frontend:
        name: Frontend build and public E2E
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install dependencies
              run: npm ci --ignore-scripts
            - name: Build frontend
              run: npm run build
            - name: Check frontend formatting and lint
              run: npx biome check src/app src/styles.css
            - name: Install Playwright browser
              run: npx playwright install --with-deps chromium
            - name: Run browser checks
              run: npm run e2e

    database:
        name: Database snapshot verification
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
                  cache-dependency-path: backend/package-lock.json
            - name: Install database client dependency
              working-directory: backend
              run: npm ci --ignore-scripts
            - name: Verify empty-state schema and migration baseline
              run: node database/scripts/verify-empty-state.mjs
            - name: Run synthetic backup and restore rehearsal
              run: node database/scripts/verify-restore-rehearsal.mjs
            - name: Run synthetic rollback and recovery rehearsal
              run: node database/scripts/verify-rollback-rehearsal.mjs
